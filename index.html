<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Shooting Range SA - Owner Portal</title>
<link rel="manifest" href="data:application/manifest+json,{}">
<style>
  :root{
    --bg:#0f1410; --panel:#1a211b; --panel2:#212b22; --accent:#8fae3f;
    --accent2:#c9d97a; --text:#eef1e8; --muted:#9aa596; --danger:#c25b4a;
    --ok:#5c9a5c; --warn:#c9a13c; --border:#2e3a2f;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
  }
  .app{max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}
  header{
    background:var(--panel2); padding:16px 18px; display:flex; align-items:center;
    justify-content:space-between; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10;
  }
  header h1{font-size:17px; font-weight:700; letter-spacing:.3px;}
  header .sub{font-size:11px; color:var(--muted);}
  .logout-btn{background:none; border:1px solid var(--border); color:var(--muted); padding:6px 10px; border-radius:6px; font-size:12px;}
  main{flex:1; padding:16px; padding-bottom:90px;}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:14px;}
  .card h2{font-size:15px; margin-bottom:10px; color:var(--accent2);}
  label{display:block; font-size:12px; color:var(--muted); margin:10px 0 4px;}
  input, select, textarea{
    width:100%; padding:10px; background:var(--panel2); border:1px solid var(--border);
    border-radius:7px; color:var(--text); font-size:14px;
  }
  textarea{resize:vertical; min-height:60px;}
  button{
    cursor:pointer; border:none; border-radius:8px; font-size:14px; font-weight:600;
  }
  .btn-primary{background:var(--accent); color:#12180f; padding:12px; width:100%; margin-top:14px;}
  .btn-secondary{background:var(--panel2); color:var(--text); border:1px solid var(--border); padding:10px; width:100%;}
  .btn-small{padding:7px 12px; font-size:12px;}
  .btn-danger{background:var(--danger); color:#fff;}
  .btn-ok{background:var(--ok); color:#fff;}
  .btn-warn{background:var(--warn); color:#241d05;}
  .row{display:flex; gap:8px;}
  .row > *{flex:1;}
  .tabbar{
    position:fixed; bottom:0; left:0; right:0; background:var(--panel2); border-top:1px solid var(--border);
    display:flex; max-width:520px; margin:0 auto;
  }
  .tabbar button{
    flex:1; background:none; padding:12px 4px; color:var(--muted); font-size:11px; border-radius:0;
    display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  .tabbar button.active{color:var(--accent2);}
  .tabbar button .ic{font-size:18px;}
  .lane-item{
    background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:8px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .lane-item .info{font-size:13px;}
  .lane-item .info .name{font-weight:700;}
  .lane-item .info .meta{color:var(--muted); font-size:11px; margin-top:2px;}
  .chip{display:inline-block; background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:2px 8px; font-size:10px; margin:2px 3px 0 0; color:var(--accent2);}
  .badge{display:inline-block; padding:3px 8px; border-radius:12px; font-size:10px; font-weight:700;}
  .badge-pending{background:#3a331a; color:var(--warn);}
  .badge-confirmed{background:#1c3320; color:var(--ok);}
  .badge-reschedule{background:#332a1a; color:#e0a85c;}
  .badge-cancelled{background:#331c1c; color:var(--danger);}
  .badge-status{background:#2a2f22; color:var(--muted);}
  .booking-card{background:var(--panel2); border:1px solid var(--border); border-radius:9px; padding:12px; margin-bottom:10px;}
  .booking-card .top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;}
  .booking-card .name{font-weight:700; font-size:14px;}
  .booking-card .slot{color:var(--accent2); font-size:12px; margin-top:2px;}
  .detail-line{font-size:12px; color:var(--muted); margin-top:4px;}
  .detail-line b{color:var(--text); font-weight:600;}
  .proof-img{width:100%; border-radius:7px; margin:8px 0; border:1px solid var(--border); max-height:220px; object-fit:contain; background:#000;}
  .actions{display:flex; gap:8px; margin-top:8px;}
  .empty{text-align:center; color:var(--muted); font-size:13px; padding:30px 10px;}
  .err{background:#331c1c; border:1px solid var(--danger); color:#f0a; color:#e08484; padding:9px 12px; border-radius:7px; font-size:12px; margin-top:10px;}
  .msg-ok{background:#1c3320; border:1px solid var(--ok); color:#9ed49e; padding:9px 12px; border-radius:7px; font-size:12px; margin-top:10px;}
  .status-banner{padding:12px; border-radius:9px; font-size:13px; margin-bottom:14px; text-align:center; font-weight:600;}
  .status-pending{background:#3a331a; color:var(--warn); border:1px solid var(--warn);}
  .status-approved{background:#1c3320; color:var(--ok); border:1px solid var(--ok);}
  .logo-preview{width:64px; height:64px; border-radius:10px; object-fit:cover; border:1px solid var(--border); background:var(--panel2);}
  .center{display:flex; align-items:center; justify-content:center; min-height:60vh; flex-direction:column; gap:12px; padding:20px;}
  .link-btn{background:none; color:var(--accent2); font-size:13px; text-decoration:underline; padding:6px;}
  h3.section{font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin:16px 0 8px;}
</style>
</head>
<body>
<div id="root" class="app"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDtSZWvu_3X-rKwocQYSM-7f4_ICVjx7Lo",
  authDomain: "shooting-range-sa.firebaseapp.com",
  projectId: "shooting-range-sa",
  storageBucket: "shooting-range-sa.firebasestorage.app",
  messagingSenderId: "955177153514",
  appId: "1:955177153514:web:4ef02e56c771680775f893"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const CALIBERS = [".22LR",".223/5.56",".243",".270",".308",".30-06","9mm",".38 Special",".357 Magnum",".40 S&W",".45 ACP","12 Gauge","Other"];

let state = {
  user: null,
  range: null,       // this owner's range doc
  lanes: [],
  bookings: [],
  tab: "range",
  loading: true,
  error: "",
  logoBase64: null
};

const root = document.getElementById("root");

function render(){ root.innerHTML = view(); attachHandlers(); }

function fmtDate(d){
  if (!d) return "";
  const dt = d.toDate ? d.toDate() : new Date(d);
  return dt.toLocaleDateString('en-ZA', { day:'2-digit', month:'short', year:'numeric' });
}

// ---------- AUTH VIEWS ----------
function authView(){
  return `
    <header><div><h1>🎯 Owner Portal</h1><div class="sub">Shooting Range SA</div></div></header>
    <main>
      <div class="card">
        <h2 id="authTitle">Owner Login</h2>
        <div id="authError"></div>
        <label>Email</label>
        <input id="authEmail" type="email" placeholder="you@example.com">
        <label>Password</label>
        <input id="authPass" type="password" placeholder="••••••••">
        <button class="btn-primary" id="authSubmit">Log In</button>
        <button class="link-btn" id="authToggle" style="margin-top:10px;">Don't have an account? Register</button>
      </div>
    </main>
  `;
}

let authMode = "login";

function attachAuthHandlers(){
  document.getElementById("authToggle").onclick = () => {
    authMode = authMode === "login" ? "register" : "login";
    document.getElementById("authTitle").textContent = authMode === "login" ? "Owner Login" : "Register as Owner";
    document.getElementById("authSubmit").textContent = authMode === "login" ? "Log In" : "Register";
    document.getElementById("authToggle").textContent = authMode === "login" ? "Don't have an account? Register" : "Already have an account? Log in";
  };
  document.getElementById("authSubmit").onclick = async () => {
    const email = document.getElementById("authEmail").value.trim();
    const pass = document.getElementById("authPass").value;
    const errBox = document.getElementById("authError");
    errBox.innerHTML = "";
    if (!email || !pass){ errBox.innerHTML = `<div class="err">Enter email and password.</div>`; return; }
    try{
      if (authMode === "login"){
        await auth.signInWithEmailAndPassword(email, pass);
      } else {
        const cred = await auth.createUserWithEmailAndPassword(email, pass);
        await db.collection("users").doc(cred.user.uid).set({
          uid: cred.user.uid, email, role: "owner", createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }
    }catch(e){
      errBox.innerHTML = `<div class="err">${e.message}</div>`;
    }
  };
}

// ---------- RANGE REGISTRATION ----------
function registerRangeView(){
  return `
    <header><div><h1>🎯 Register Your Range</h1><div class="sub">${state.user.email}</div></div>
      <button class="logout-btn" id="logoutBtn">Log out</button></header>
    <main>
      <div class="card">
        <h2>Range Details</h2>
        <div id="regError"></div>
        <label>Range Name</label>
        <input id="rName" placeholder="e.g. Highveld Shooting Range">
        <label>Logo / Photo</label>
        <div class="row" style="align-items:center;">
          <img id="logoPreview" class="logo-preview" src="" style="display:none;">
          <input id="rLogo" type="file" accept="image/*">
        </div>
        <label>Address</label>
        <textarea id="rAddress" placeholder="Full physical address"></textarea>
        <label>Contact Number</label>
        <input id="rContact" placeholder="082 000 0000">
        <h3 class="section">Banking Details (for EFT)</h3>
        <label>Account Holder</label>
        <input id="bHolder" placeholder="Business / owner name">
        <label>Bank Name</label>
        <input id="bBank" placeholder="e.g. FNB, Standard Bank">
        <label>Account Number</label>
        <input id="bAcc" placeholder="Account number">
        <label>Branch Code</label>
        <input id="bBranch" placeholder="Branch code">
        <h3 class="section">Lanes</h3>
        <div id="laneBuilderList"></div>
        <div class="card" style="background:var(--panel2); margin-top:8px;">
          <label>Lane Name</label>
          <input id="newLaneName" placeholder="e.g. Bay 1">
          <label>Distance (metres)</label>
          <input id="newLaneDist" type="number" placeholder="e.g. 25">
          <label>Allowed Calibers</label>
          <select id="newLaneCal" multiple size="6">
            ${CALIBERS.map(c => `<option value="${c}">${c}</option>`).join("")}
          </select>
          <button class="btn-secondary" id="addLaneBtn" style="margin-top:10px;">+ Add Lane</button>
        </div>
        <button class="btn-primary" id="submitRangeBtn">Submit Range for Approval</button>
      </div>
    </main>
  `;
}

let pendingLanes = [];

function attachRegisterHandlers(){
  document.getElementById("logoutBtn").onclick = () => auth.signOut();

  document.getElementById("rLogo").onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    compressImageToBase64(file, 300, 0.6).then(b64 => {
      state.logoBase64 = b64;
      const img = document.getElementById("logoPreview");
      img.src = b64; img.style.display = "block";
    });
  };

  renderLaneBuilder();

  document.getElementById("addLaneBtn").onclick = () => {
    const name = document.getElementById("newLaneName").value.trim();
    const dist = document.getElementById("newLaneDist").value.trim();
    const calSel = document.getElementById("newLaneCal");
    const cals = Array.from(calSel.selectedOptions).map(o => o.value);
    if (!name || !dist || cals.length === 0){
      alert("Enter lane name, distance, and select at least one caliber.");
      return;
    }
    pendingLanes.push({ name, distance: dist, calibers: cals });
    document.getElementById("newLaneName").value = "";
    document.getElementById("newLaneDist").value = "";
    Array.from(calSel.options).forEach(o => o.selected = false);
    renderLaneBuilder();
  };

  document.getElementById("submitRangeBtn").onclick = async () => {
    const errBox = document.getElementById("regError");
    errBox.innerHTML = "";
    const name = document.getElementById("rName").value.trim();
    const address = document.getElementById("rAddress").value.trim();
    const contact = document.getElementById("rContact").value.trim();
    const bHolder = document.getElementById("bHolder").value.trim();
    const bBank = document.getElementById("bBank").value.trim();
    const bAcc = document.getElementById("bAcc").value.trim();
    const bBranch = document.getElementById("bBranch").value.trim();

    if (!name || !address || !contact || pendingLanes.length === 0){
      errBox.innerHTML = `<div class="err">Fill in range name, address, contact, and add at least one lane.</div>`;
      return;
    }
    try{
      const rangeRef = db.collection("ranges").doc();
      await rangeRef.set({
        rangeId: rangeRef.id,
        ownerUid: state.user.uid,
        name, address, contactNumber: contact,
        logoUrl: state.logoBase64 || "",
        bankingDetails: { holder: bHolder, bank: bBank, accountNumber: bAcc, branchCode: bBranch },
        status: "pending_approval",
        active: true,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      const batch = db.batch();
      pendingLanes.forEach(l => {
        const laneRef = rangeRef.collection("lanes").doc();
        batch.set(laneRef, {
          laneId: laneRef.id, laneName: l.name, distance: l.distance,
          calibers: l.calibers, active: true
        });
      });
      await batch.commit();
      pendingLanes = [];
      await loadOwnerData();
    }catch(e){
      errBox.innerHTML = `<div class="err">${e.message}</div>`;
    }
  };
}

function renderLaneBuilder(){
  document.getElementById("laneBuilderList").innerHTML = pendingLanes.map((l, i) => `
    <div class="lane-item">
      <div class="info">
        <div class="name">${l.name} — ${l.distance}m</div>
        <div class="meta">${l.calibers.map(c => `<span class="chip">${c}</span>`).join("")}</div>
      </div>
      <button class="btn-small btn-danger" data-remove-lane="${i}">✕</button>
    </div>
  `).join("") || `<div class="empty">No lanes added yet</div>`;

  document.querySelectorAll("[data-remove-lane]").forEach(btn => {
    btn.onclick = () => {
      pendingLanes.splice(parseInt(btn.dataset.removeLane), 1);
      renderLaneBuilder();
    };
  });
}

function compressImageToBase64(file, maxWidth, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---------- DASHBOARD ----------
function dashboardView(){
  const statusBanner = state.range.status === "pending_approval"
    ? `<div class="status-banner status-pending">⏳ Your range is awaiting admin approval and is not yet visible to clients.</div>`
    : `<div class="status-banner status-approved">✅ Live — visible to clients</div>`;

  let body = "";
  if (state.tab === "range") body = rangeTabView();
  if (state.tab === "lanes") body = lanesTabView();
  if (state.tab === "bookings") body = bookingsTabView();

  return `
    <header>
      <div><h1>🎯 ${state.range.name}</h1><div class="sub">${state.user.email}</div></div>
      <button class="logout-btn" id="logoutBtn">Log out</button>
    </header>
    <main>
      ${statusBanner}
      ${body}
    </main>
    <div class="tabbar">
      <button class="${state.tab==='range'?'active':''}" data-tab="range"><span class="ic">🏠</span>Range</button>
      <button class="${state.tab==='lanes'?'active':''}" data-tab="lanes"><span class="ic">🎯</span>Lanes</button>
      <button class="${state.tab==='bookings'?'active':''}" data-tab="bookings"><span class="ic">📋</span>Bookings</button>
    </div>
  `;
}

function rangeTabView(){
  const r = state.range;
  return `
    <div class="card">
      <h2>Range Details</h2>
      ${r.logoUrl ? `<img src="${r.logoUrl}" class="logo-preview" style="margin-bottom:10px;">` : ""}
      <div class="detail-line"><b>Name:</b> ${r.name}</div>
      <div class="detail-line"><b>Address:</b> ${r.address}</div>
      <div class="detail-line"><b>Contact:</b> ${r.contactNumber}</div>
      <h3 class="section">Banking Details</h3>
      <div class="detail-line"><b>Holder:</b> ${r.bankingDetails?.holder || "-"}</div>
      <div class="detail-line"><b>Bank:</b> ${r.bankingDetails?.bank || "-"}</div>
      <div class="detail-line"><b>Account:</b> ${r.bankingDetails?.accountNumber || "-"}</div>
      <div class="detail-line"><b>Branch Code:</b> ${r.bankingDetails?.branchCode || "-"}</div>
    </div>
  `;
}

function lanesTabView(){
  return `
    <div class="card">
      <h2>Lanes (${state.lanes.length})</h2>
      ${state.lanes.map(l => `
        <div class="lane-item">
          <div class="info">
            <div class="name">${l.laneName} — ${l.distance}m</div>
            <div class="meta">${(l.calibers||[]).map(c => `<span class="chip">${c}</span>`).join("")}</div>
          </div>
        </div>
      `).join("") || `<div class="empty">No lanes yet</div>`}
      <div style="font-size:11px; color:var(--muted); margin-top:10px;">
        Contact support to edit lanes after initial setup.
      </div>
    </div>
  `;
}

function bookingsTabView(){
  const pending = state.bookings.filter(b => b.status === "pending_payment" || b.status === "awaiting_approval");
  const confirmed = state.bookings.filter(b => b.status === "confirmed");
  const reschedule = state.bookings.filter(b => b.status === "reschedule_requested");

  function bookingCard(b, showApprove){
    return `
      <div class="booking-card">
        <div class="top">
          <div>
            <div class="name">${b.clientName} ${b.clientSurname}</div>
            <div class="slot">${laneNameOf(b.laneId)} · ${fmtDate(b.date)} · ${b.startTime}–${b.endTime}</div>
          </div>
          <span class="badge ${badgeClass(b.status)}">${statusLabel(b.status)}</span>
        </div>
        <div class="detail-line"><b>Cell:</b> ${b.clientCell}</div>
        <div class="detail-line"><b>Caliber:</b> ${b.caliber}</div>
        <div class="detail-line"><b>Emergency Contact:</b> ${b.emergencyContactName} — ${b.emergencyContactNumber}</div>
        <div class="detail-line"><b>Medical Aid:</b> ${b.hasMedicalAid ? (b.medicalAidName || "Yes (name not given)") : "None"}</div>
        ${b.paymentProofUrl ? `<img class="proof-img" src="${b.paymentProofUrl}">` : `<div class="detail-line" style="color:var(--danger);">No payment proof uploaded yet</div>`}
        ${showApprove ? `
          <div class="actions">
            <button class="btn-small btn-ok" style="flex:1;" data-approve="${b.id}">✓ Approve</button>
            <button class="btn-small btn-danger" style="flex:1;" data-reject="${b.id}">✕ Reject</button>
          </div>` : ""}
      </div>
    `;
  }

  return `
    <div class="card">
      <h2>Pending Approval (${pending.length})</h2>
      ${pending.map(b => bookingCard(b, true)).join("") || `<div class="empty">No pending bookings</div>`}
    </div>
    ${reschedule.length ? `
    <div class="card">
      <h2>Reschedule Requests (${reschedule.length})</h2>
      ${reschedule.map(b => bookingCard(b, false)).join("")}
    </div>` : ""}
    <div class="card">
      <h2>Confirmed (${confirmed.length})</h2>
      ${confirmed.map(b => bookingCard(b, false)).join("") || `<div class="empty">No confirmed bookings yet</div>`}
    </div>
  `;
}

function laneNameOf(laneId){
  const l = state.lanes.find(l => l.id === laneId);
  return l ? l.laneName : "Lane";
}
function badgeClass(status){
  return { pending_payment:"badge-pending", awaiting_approval:"badge-pending",
    confirmed:"badge-confirmed", reschedule_requested:"badge-reschedule",
    cancelled:"badge-cancelled" }[status] || "badge-status";
}
function statusLabel(status){
  return { pending_payment:"Waiting for payment confirmation", awaiting_approval:"Awaiting approval",
    confirmed:"Confirmed", reschedule_requested:"Reschedule requested",
    cancelled:"Cancelled" }[status] || status;
}

function attachDashboardHandlers(){
  document.getElementById("logoutBtn").onclick = () => auth.signOut();
  document.querySelectorAll("[data-tab]").forEach(btn => {
    btn.onclick = () => { state.tab = btn.dataset.tab; render(); };
  });
  document.querySelectorAll("[data-approve]").forEach(btn => {
    btn.onclick = async () => {
      await db.collection("bookings").doc(btn.dataset.approve).update({
        status: "confirmed", approvedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      await loadOwnerData();
    };
  });
  document.querySelectorAll("[data-reject]").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm("Reject this booking? The slot will free up.")) return;
      await db.collection("bookings").doc(btn.dataset.reject).update({ status: "cancelled" });
      await loadOwnerData();
    };
  });
}

// ---------- MASTER VIEW ----------
function view(){
  if (state.loading) return `<div class="center"><div>Loading…</div></div>`;
  if (!state.user) return authView();
  if (!state.range) return registerRangeView();
  return dashboardView();
}

function attachHandlers(){
  if (!state.user) return attachAuthHandlers();
  if (!state.range) return attachRegisterHandlers();
  return attachDashboardHandlers();
}

// ---------- DATA LOADING ----------
async function loadOwnerData(){
  state.loading = true; render();
  const rangeSnap = await db.collection("ranges").where("ownerUid", "==", state.user.uid).limit(1).get();
  if (rangeSnap.empty){
    state.range = null; state.loading = false; render(); return;
  }
  const rangeDoc = rangeSnap.docs[0];
  state.range = { id: rangeDoc.id, ...rangeDoc.data() };

  const lanesSnap = await db.collection("ranges").doc(state.range.id).collection("lanes").get();
  state.lanes = lanesSnap.docs.map(d => ({ id: d.id, ...d.data() }));

  const bookingsSnap = await db.collection("bookings").where("rangeId", "==", state.range.id).get();
  state.bookings = bookingsSnap.docs.map(d => ({ id: d.id, ...d.data() }))
    .sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));

  state.loading = false;
  render();
}

auth.onAuthStateChanged(async (user) => {
  state.user = user;
  if (user){
    await loadOwnerData();
  } else {
    state.range = null; state.lanes = []; state.bookings = [];
    state.loading = false;
    render();
  }
});

render();
</script>
</body>
</html>
