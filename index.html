const OPEN_HOUR = 7, CLOSE_HOUR = 20;
function generateSlots(){
  const slots = [];
  for (let h = OPEN_HOUR; h < CLOSE_HOUR; h++){
    slots.push(`${String(h).padStart(2,"0")}:00`);
    slots.push(`${String(h).padStart(2,"0")}:30`);
  }
  return slots;
}
const ALL_SLOTS = generateSlots();
function addMinutes(hhmm, mins){
  const [h,m] = hhmm.split(":").map(Number);
  const total = h*60 + m + mins;
  const nh = Math.floor(total/60), nm = total%60;
  return `${String(nh).padStart(2,"0")}:${String(nm).padStart(2,"0")}`;
}
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function isBookingExpired(b){
  const now = new Date();
  const endDt = new Date(`${b.date}T${b.endTime}:00`);
  return endDt < now;
}

function fmtDate(d){
  if (!d) return "";
  const dt = d.toDate ? d.toDate() : new Date(d);

let authMode = "login";

function attachAuthHandlers(){
  document.getElementById("authToggle").onclick = () => {

function compressImageToBase64(file, maxWidth, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function availabilityTabView(){

  const takenSet = new Set();
  const blockedMap = {};

    let t = b.startTime;
    while (t !== b.endTime){
      if (b.status === "blocked") blockedMap[t] = b.id; else takenSet.add(t);
      t = addMinutes(t, 30);
    }
  });

  const slotsHtml = ALL_SLOTS.map(s => {
    let cls = "slot";
    let clickable = true;
    let label = s;
    if (takenSet.has(s)){ cls += " taken"; clickable = false; label = "Booked"; }
    else if (blockedMap[s]){ cls += " taken"; clickable = true; label = "Blocked"; }
    else { cls += " open"; }
    return `<div class="${cls}" data-avail-slot="${s}" data-blocked-id="${blockedMap[s] || ''}" ${clickable ? "" : "style=\"cursor:not-allowed;\""}>${label}<br><span style="font-size:9px; opacity:.7;">${s}</span></div>`;
  }).join("");

  return `
    <div class="card">
      <h2>Block Slots for Maintenance</h2>
      <div style="font-size:11px; color:var(--muted); margin-bottom:10px;">Tap an open slot to block it; tap a blocked slot to unblock it. Booked slots can't be changed here.</div>
      <label>Lane</label>
      <select id="availLaneSelect">
        ${state.lanes.map(l => `<option value="${l.id}" ${l.id === laneId ? "selected" : ""}>${l.laneName}</option>`).join("")}
      </select>
      <label>Date</label>
      <input type="date" id="availDateInput" value="${state.availabilityDate}">
      ${isClosedDay ? `<div class="detail-line" style="color:var(--warn); margin-top:8px;">This whole date is already marked Closed on the Range tab — no bookings possible regardless.</div>` : ""}
      <div class="slot-grid" style="margin-top:12px;">${slotsHtml}</div>
    </div>
  `;
}

function bookingsTabView(){
  const pending = state.bookings.filter(b => (b.status === "pending_payment" || b.status === "awaiting_approval"));
  const confirmed = state.bookings.filter(b => b.status === "confirmed");
  const reschedule = state.bookings.filter(b => b.status === "reschedule_requested");
  const expiredCount = state.bookings.filter(b => b.status !== "cancelled" && b.status !== "blocked" && isBookingExpired(b)).length;

  function bookingCard(b, showApprove){
    const expired = isBookingExpired(b);
    return `
      <div class="booking-card">
        <div class="top">
          <div>
            <div class="name">${b.clientName} ${b.clientSurname}</div>
            <div class="slot">${laneNameOf(b.laneId)} · ${fmtDate(b.date)} · ${b.startTime}–${b.endTime}</div>
          </div>
          <div style="display:flex; flex-direction:column; gap:4px; align-items:flex-end;">
            <span class="badge ${badgeClass(b.status)}">${statusLabel(b.status)}</span>
            ${expired ? `<span class="badge badge-cancelled">Expired</span>` : ""}
          </div>
        </div>
        <div class="detail-line"><b>Cell:</b> ${b.clientCell}</div>
        <div class="detail-line"><b>Caliber:</b> ${b.caliber}</div>
        <div class="detail-line"><b>Emergency Contact:</b> ${b.emergencyContactName} — ${b.emergencyContactNumber}</div>
        <div class="detail-line"><b>Medical Aid:</b> ${b.hasMedicalAid ? (b.medicalAidName || "Yes (name not given)") : "None"}</div>
        ${b.paymentProofUrl ? `<img class="proof-img" src="${b.paymentProofUrl}">` : `<div class="detail-line" style="color:var(--danger);">No payment proof uploaded yet</div>`}
        ${showApprove && !expired ? `
          <div class="actions">
            <button class="btn-small btn-ok" style="flex:1;" data-approve="${b.id}">✓ Approve</button>
            <button class="btn-small btn-danger" style="flex:1;" data-reject="${b.id}">✕ Reject</button>
          </div>` : ""}
        ${expired ? `
          <div class="actions">
            <button class="btn-small btn-danger" style="flex:1;" data-delete-booking="${b.id}">🗑 Delete Expired</button>
          </div>` : ""}
      </div>
    `;
  }

  return `
    ${expiredCount > 0 ? `
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div class="detail-line" style="margin:0;"><b>${expiredCount}</b> expired booking(s) across all lanes</div>
        <button class="btn-small btn-danger" id="clearAllExpiredBtn">Delete All Expired</button>
      </div>
    </div>` : ""}
    <div class="card">
      <h2>Pending Approval (${pending.length})</h2>
      ${pending.map(b => bookingCard(b, true)).join("") || `<div class="empty">No pending bookings</div>`}
    </div>
    ${reschedule.length ? `
    <div class="card">
      <h2>Reschedule Requests (${reschedule.length})</h2>
      ${reschedule.map(b => bookingCard(b, false)).join("")}
    </div>` : ""}
    <div class="card">
      <h2>Confirmed (${confirmed.length})</h2>
      ${confirmed.map(b => bookingCard(b, false)).join("") || `<div class="empty">No confirmed bookings yet</div>`}
    </div>
  `;
}

function laneNameOf(laneId){
  const l = state.lanes.find(l => l.id === laneId);
  return l ? l.laneName : "Lane";
}
function badgeClass(status){
  return { pending_payment:"badge-pending", awaiting_approval:"badge-pending",
    confirmed:"badge-confirmed", reschedule_requested:"badge-reschedule",
    cancelled:"badge-cancelled" }[status] || "badge-status";
}
function statusLabel(status){
  return { pending_payment:"Waiting for payment confirmation", awaiting_approval:"Awaiting approval",
    confirmed:"Confirmed", reschedule_requested:"Reschedule requested",
    cancelled:"Cancelled" }[status] || status;
}

function attachDashboardHandlers(){
  document.getElementById("logoutBtn").onclick = () => auth.signOut();
  document.querySelectorAll("[data-tab]").forEach(btn => {
    btn.onclick = async () => {
      state.tab = btn.dataset.tab; state.editingRange = false;
      if (state.tab === "availability" && state.lanes.length){
        if (!state.availabilityLaneId) state.availabilityLaneId = state.lanes[0].id;
        await loadAvailabilitySlots();
      }
      render();
    };
  });
  document.querySelectorAll("[data-approve]").forEach(btn => {
    btn.onclick = async () => {
      await db.collection("bookings").doc(btn.dataset.approve).update({
        status: "confirmed", approvedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    };
  });
  document.querySelectorAll("[data-reject]").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm("Reject this booking? The slot will free up.")) return;
      await db.collection("bookings").doc(btn.dataset.reject).update({ status: "cancelled" });
    };
  });

  // Range tab
  const editBtn = document.getElementById("editRangeBtn");
  if (editBtn) editBtn.onclick = () => { state.editingRange = true; render(); };
  const cancelEditBtn = document.getElementById("cancelEditRangeBtn");
  if (cancelEditBtn) cancelEditBtn.onclick = () => { state.editingRange = false; render(); };
  const saveRangeBtn = document.getElementById("saveRangeBtn");
  if (saveRangeBtn) saveRangeBtn.onclick = async () => {
    const errBox = document.getElementById("editRangeErr");
    const name = document.getElementById("erName").value.trim();
    const address = document.getElementById("erAddress").value.trim();
    const contact = document.getElementById("erContact").value.trim();
    if (!name || !address || !contact){
      errBox.innerHTML = `<div class="err">Name, address, and contact are required.</div>`;
      return;
    }
    try{
      await db.collection("ranges").doc(state.range.id).update({
        name, address, contactNumber: contact,
        bankingDetails: {
          holder: document.getElementById("erHolder").value.trim(),
          bank: document.getElementById("erBank").value.trim(),
          accountNumber: document.getElementById("erAcc").value.trim(),
          branchCode: document.getElementById("erBranch").value.trim()
        }
      });
      state.range = { ...state.range, name, address, contactNumber: contact };
      state.editingRange = false;
      await reloadRangeDoc();
    }catch(e){
      errBox.innerHTML = `<div class="err">${e.message}</div>`;
    }
  };
  document.querySelectorAll("[data-remove-closed]").forEach(btn => {
    btn.onclick = async () => {
      await db.collection("ranges").doc(state.range.id).update({
        closedDates: firebase.firestore.FieldValue.arrayRemove(btn.dataset.removeClosed)
      });
      await reloadRangeDoc();
    };
  });
  const addClosedBtn = document.getElementById("addClosedDateBtn");
  if (addClosedBtn) addClosedBtn.onclick = async () => {
    const val = document.getElementById("newClosedDate").value;
    if (!val) return;
    await db.collection("ranges").doc(state.range.id).update({
      closedDates: firebase.firestore.FieldValue.arrayUnion(val)
    });
    await reloadRangeDoc();
  };

  // Lanes tab
  document.querySelectorAll("[data-delete-lane]").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm("Delete this lane? Existing bookings for it will remain but no new ones can be made.")) return;
      await db.collection("ranges").doc(state.range.id).collection("lanes").doc(btn.dataset.deleteLane).delete();
      await reloadLanes();
    };
  });
  const dAddLaneBtn = document.getElementById("dAddLaneBtn");
  if (dAddLaneBtn) dAddLaneBtn.onclick = async () => {
    const errBox = document.getElementById("addLaneErr");
    const name = document.getElementById("dNewLaneName").value.trim();
    const dist = document.getElementById("dNewLaneDist").value.trim();
    const calSel = document.getElementById("dNewLaneCal");
    const cals = Array.from(calSel.selectedOptions).map(o => o.value);
    if (!name || !dist || cals.length === 0){
      errBox.innerHTML = `<div class="err">Enter lane name, distance, and select at least one caliber.</div>`;
      return;
    }
    const laneRef = db.collection("ranges").doc(state.range.id).collection("lanes").doc();
    await laneRef.set({ laneId: laneRef.id, laneName: name, distance: dist, calibers: cals, active: true });
    await reloadLanes();
  };

  // Availability tab
  const availLaneSelect = document.getElementById("availLaneSelect");
  if (availLaneSelect) availLaneSelect.onchange = async () => {
    state.availabilityLaneId = availLaneSelect.value;
    await loadAvailabilitySlots();
    render();
  };
  const availDateInput = document.getElementById("availDateInput");
  if (availDateInput) availDateInput.onchange = async () => {
    state.availabilityDate = availDateInput.value;
    await loadAvailabilitySlots();
    render();
  };
  document.querySelectorAll("[data-avail-slot]").forEach(el => {
    el.onclick = async () => {
      const slot = el.dataset.availSlot;
      const blockedId = el.dataset.blockedId;
      if (blockedId){
        await db.collection("bookings").doc(blockedId).delete();
      } else {
        const laneId = state.availabilityLaneId || state.lanes[0].id;
        const lane = state.lanes.find(l => l.id === laneId);
        const ref = db.collection("bookings").doc();
        await ref.set({
          bookingId: ref.id,
          rangeId: state.range.id,
          rangeName: state.range.name,
          laneId, laneName: lane ? lane.laneName : "",
          date: state.availabilityDate,
          startTime: slot, endTime: addMinutes(slot, 30),
          status: "blocked",
          clientUid: state.user.uid,
          clientName: "Maintenance", clientSurname: "",
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }
      await loadAvailabilitySlots();
      render();
    };
  });

  // Bookings tab - expired deletion
  document.querySelectorAll("[data-delete-booking]").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm("Delete this expired booking?")) return;
      await db.collection("bookings").doc(btn.dataset.deleteBooking).delete();
    };
  });
  const clearAllExpiredBtn = document.getElementById("clearAllExpiredBtn");
  if (clearAllExpiredBtn) clearAllExpiredBtn.onclick = async () => {
    const expired = state.bookings.filter(b => b.status !== "cancelled" && b.status !== "blocked" && isBookingExpired(b));
    if (!expired.length) return;
    if (!confirm(`Delete ${expired.length} expired booking(s)? This cannot be undone.`)) return;
    const batch = db.batch();
    expired.forEach(b => batch.delete(db.collection("bookings").doc(b.id)));
    await batch.commit();
  };
}

async function loadAvailabilitySlots(){
  const laneId = state.availabilityLaneId || (state.lanes[0] && state.lanes[0].id);
  if (!laneId) return;
  const snap = await db.collection("bookings")
    .where("rangeId", "==", state.range.id)
    .where("laneId", "==", laneId)
    .where("date", "==", state.availabilityDate)
    .get();
  state.availabilitySlotBookings = snap.docs.map(d => ({ id: d.id, ...d.data() }))
    .filter(b => b.status === "pending_payment" || b.status === "awaiting_approval" || b.status === "confirmed" || b.status === "blocked");
}

async function reloadRangeDoc(){
  const doc = await db.collection("ranges").doc(state.range.id).get();
  state.range = { id: doc.id, ...doc.data() };
  render();
}

async function reloadLanes(){
  const lanesSnap = await db.collection("ranges").doc(state.range.id).collection("lanes").get();
  state.lanes = lanesSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  render();
}

// ---------- MASTER VIEW ----------
function view(){
  if (state.loading) return `<div class="center"><div>Loading…</div></div>`;
  if (state.loadError) return `<div class="center">
      <div class="err" style="max-width:320px;">Couldn't load your data:<br>${state.loadError}</div>
      <button class="btn-secondary" id="retryBtn" style="max-width:200px;">Retry</button>
      <button class="link-btn" id="logoutRetryBtn">Log out</button>
    </div>`;
  if (!state.user) return authView();
  if (!state.range) return registerRangeView();
  return dashboardView();
}

function attachHandlers(){
  if (state.loading) return;
  if (state.loadError){
    document.getElementById("retryBtn").onclick = loadOwnerData;
    document.getElementById("logoutRetryBtn").onclick = () => auth.signOut();
    return;
  }
  if (!state.user) return attachAuthHandlers();
  if (!state.range) return attachRegisterHandlers();
  return attachDashboardHandlers();
}

// ---------- DATA LOADING ----------
let bookingsUnsub = null;

async function loadOwnerData(){
  state.loading = true; state.loadError = ""; render();
  try{
    const rangeSnap = await db.collection("ranges").where("ownerUid", "==", state.user.uid).limit(1).get();
    if (rangeSnap.empty){
      state.range = null; state.loading = false; render(); return;
    }
    const rangeDoc = rangeSnap.docs[0];
    state.range = { id: rangeDoc.id, ...rangeDoc.data() };

    const lanesSnap = await db.collection("ranges").doc(state.range.id).collection("lanes").get();
    state.lanes = lanesSnap.docs.map(d => ({ id: d.id, ...d.data() }));

    if (bookingsUnsub) bookingsUnsub();
    bookingsUnsub = db.collection("bookings").where("rangeId", "==", state.range.id)
      .onSnapshot(snap => {
        state.bookings = snap.docs.map(d => ({ id: d.id, ...d.data() }))
          .sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
        state.loading = false;
        render();
      }, err => {
        state.loading = false;
        state.loadError = err.message;
        render();
      });
  }catch(e){
    state.loading = false;
    state.loadError = e.message;
    render();
  }
}

auth.onAuthStateChanged(async (user) => {
  state.user = user;
  if (user){
    await loadOwnerData();
  } else {
    if (bookingsUnsub){ bookingsUnsub(); bookingsUnsub = null; }
    state.range = null; state.lanes = []; state.bookings = [];
    state.loading = false;
    render();
  }
});

setInterval(async () => {
  if (!state.user || !state.range) return;
  await reloadRangeDoc();
  await reloadLanes();
  if (state.tab === "availability") await loadAvailabilitySlots();
  render();
}, 15 * 60 * 1000);

render();
</script>
</body>
</html>
