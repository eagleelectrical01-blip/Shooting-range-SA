<style>
  :root{
    --bg:#0f1410; --panel:#1a211b; --panel2:#212b22; --accent:#8fae3f;
    --accent2:#c9d97a; --text:#eef1e8; --muted:#9aa596; --danger:#c25b4a;
    --ok:#5c9a5c; --warn:#c9a13c; --border:#2e3a2f;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
  }
  .app{max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}
  header{
    background:var(--panel2); padding:16px 18px; display:flex; align-items:center;
    justify-content:space-between; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10;
  }
  header h1{font-size:17px; font-weight:700; letter-spacing:.3px;}
  header .sub{font-size:11px; color:var(--muted);}
  .logout-btn{background:none; border:1px solid var(--border); color:var(--muted); padding:6px 10px; border-radius:6px; font-size:12px;}
  main{flex:1; padding:16px; padding-bottom:90px;}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:14px;}
  .card h2{font-size:15px; margin-bottom:10px; color:var(--accent2);}
  label{display:block; font-size:12px; color:var(--muted); margin:10px 0 4px;}
  input, select, textarea{
    width:100%; padding:10px; background:var(--panel2); border:1px solid var(--border);
    border-radius:7px; color:var(--text); font-size:14px;
  }
  textarea{resize:vertical; min-height:60px;}
  button{
    cursor:pointer; border:none; border-radius:8px; font-size:14px; font-weight:600;
  }
  .btn-primary{background:var(--accent); color:#12180f; padding:12px; width:100%; margin-top:14px;}
  .btn-secondary{background:var(--panel2); color:var(--text); border:1px solid var(--border); padding:10px; width:100%;}
  .btn-small{padding:7px 12px; font-size:12px;}
  .btn-danger{background:var(--danger); color:#fff;}
  .btn-ok{background:var(--ok); color:#fff;}
  .btn-warn{background:var(--warn); color:#241d05;}
  .row{display:flex; gap:8px;}
  .row > *{flex:1;}
  .tabbar{
    position:fixed; bottom:0; left:0; right:0; background:var(--panel2); border-top:1px solid var(--border);
    display:flex; max-width:520px; margin:0 auto;
  }
  .tabbar button{
    flex:1; background:none; padding:12px 4px; color:var(--muted); font-size:11px; border-radius:0;
    display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  .tabbar button.active{color:var(--accent2);}
  .tabbar button .ic{font-size:18px;}
  .lane-item{
    background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:8px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .lane-item .info{font-size:13px;}
  .lane-item .info .name{font-weight:700;}
  .lane-item .info .meta{color:var(--muted); font-size:11px; margin-top:2px;}
  .chip{display:inline-block; background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:2px 8px; font-size:10px; margin:2px 3px 0 0; color:var(--accent2);}
  .badge{display:inline-block; padding:3px 8px; border-radius:12px; font-size:10px; font-weight:700;}
  .badge-pending{background:#3a331a; color:var(--warn);}
  .badge-confirmed{background:#1c3320; color:var(--ok);}
  .badge-reschedule{background:#332a1a; color:#e0a85c;}
  .badge-cancelled{background:#331c1c; color:var(--danger);}
  .badge-status{background:#2a2f22; color:var(--muted);}
  .booking-card{background:var(--panel2); border:1px solid var(--border); border-radius:9px; padding:12px; margin-bottom:10px;}
  .booking-card .top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;}
  .booking-card .name{font-weight:700; font-size:14px;}
  .booking-card .slot{color:var(--accent2); font-size:12px; margin-top:2px;}
  .detail-line{font-size:12px; color:var(--muted); margin-top:4px;}
  .detail-line b{color:var(--text); font-weight:600;}
  .proof-img{width:100%; border-radius:7px; margin:8px 0; border:1px solid var(--border); max-height:220px; object-fit:contain; background:#000;}
  .actions{display:flex; gap:8px; margin-top:8px;}
  .empty{text-align:center; color:var(--muted); font-size:13px; padding:30px 10px;}
  .err{background:#331c1c; border:1px solid var(--danger); color:#f0a; color:#e08484; padding:9px 12px; border-radius:7px; font-size:12px; margin-top:10px;}
  .msg-ok{background:#1c3320; border:1px solid var(--ok); color:#9ed49e; padding:9px 12px; border-radius:7px; font-size:12px; margin-top:10px;}
  .status-banner{padding:12px; border-radius:9px; font-size:13px; margin-bottom:14px; text-align:center; font-weight:600;}
  .status-pending{background:#3a331a; color:var(--warn); border:1px solid var(--warn);}
  .status-approved{background:#1c3320; color:var(--ok); border:1px solid var(--ok);}
  .logo-preview{width:64px; height:64px; border-radius:10px; object-fit:cover; border:1px solid var(--border); background:var(--panel2);}
  .center{display:flex; align-items:center; justify-content:center; min-height:60vh; flex-direction:column; gap:12px; padding:20px;}
  .link-btn{background:none; color:var(--accent2); font-size:13px; text-decoration:underline; padding:6px;}
  h3.section{font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); margin:16px 0 8px;}
</style>
</head>

const CALIBERS = [".22LR",".223/5.56",".243",".270",".308",".30-06","9mm",".38 Special",".357 Magnum",".40 S&W",".45 ACP","12 Gauge","Other"];

const OPEN_HOUR = 7, CLOSE_HOUR = 20;
function generateSlots(){
  const slots = [];
  for (let h = OPEN_HOUR; h < CLOSE_HOUR; h++){
    slots.push(`${String(h).padStart(2,"0")}:00`);
    slots.push(`${String(h).padStart(2,"0")}:30`);
  }
  return slots;
}
const ALL_SLOTS = generateSlots();
function addMinutes(hhmm, mins){
  const [h,m] = hhmm.split(":").map(Number);
  const total = h*60 + m + mins;
  const nh = Math.floor(total/60), nm = total%60;
  return `${String(nh).padStart(2,"0")}:${String(nm).padStart(2,"0")}`;
}
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function isBookingExpired(b){
  const now = new Date();
  const endDt = new Date(`${b.date}T${b.endTime}:00`);
  return endDt < now;
}
function slotLockId(rangeId, laneId, date, time){
  return `${rangeId}_${laneId}_${date}_${time.replace(":","")}`;
}

function fmtDate(d){
  if (!d) return "";
  const dt = d.toDate ? d.toDate() : new Date(d);
  return dt.toLocaleDateString('en-ZA', { day:'2-digit', month:'short', year:'numeric' });
}

function authView(){

        <button class="link-btn" id="authToggle" style="margin-top:10px;">Don't have an account? Register</button>

      </div>

let authMode = "login";

function attachAuthHandlers(){
  document.getElementById("authToggle").onclick = () => {
    authMode = authMode === "login" ? "register" : "login";
    document.getElementById("authTitle").textContent = authMode === "login" ? "Owner Login" : "Register as Owner";
    document.getElementById("authSubmit").textContent = authMode === "login" ? "Log In" : "Register";
    document.getElementById("authToggle").textContent = authMode === "login" ? "Don't have an account? Register" : "Already have an account? Log in";
  };
  document.getElementById("authSubmit").onclick = async () => {
    const email = document.getElementById("authEmail").value.trim();
    const pass = document.getElementById("authPass").value;
    const errBox = document.getElementById("authError");
    errBox.innerHTML = "";
    if (!email || !pass){ errBox.innerHTML = `<div class="err">Enter email and password.</div>`; return; }
    try{
      if (authMode === "login"){
        await auth.signInWithEmailAndPassword(email, pass);
      } else {
        const cred = await auth.createUserWithEmailAndPassword(email, pass);
        await db.collection("users").doc(cred.user.uid).set({
          uid: cred.user.uid, email, role: "owner", createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }
    }catch(e){
      errBox.innerHTML = `<div class="err">${e.message}</div>`;
    }
  };
  document.getElementById("forgotPassBtn").onclick = async () => {
    const email = document.getElementById("authEmail").value.trim();
    const errBox = document.getElementById("authError");
    errBox.innerHTML = "";
    if (!email){ errBox.innerHTML = `<div class="err">Enter your email above first, then tap Forgot password again.</div>`; return; }
    try{
      await auth.sendPasswordResetEmail(email);
      errBox.innerHTML = `<div class="msg-ok">Password reset email sent — check your inbox.</div>`;
    }catch(e){
      errBox.innerHTML = `<div class="err">${e.message}</div>`;
    }
  };
}

let pendingLanes = [];

function attachRegisterHandlers(){
  document.getElementById("logoutBtn").onclick = () => auth.signOut();

  document.getElementById("rLogo").onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    compressImageToBase64(file, 300, 0.6).then(b64 => {
      state.logoBase64 = b64;
      const img = document.getElementById("logoPreview");
      img.src = b64; img.style.display = "block";
    });
  };

  renderLaneBuilder();

  document.getElementById("addLaneBtn").onclick = () => {
    const name = document.getElementById("newLaneName").value.trim();
    const dist = document.getElementById("newLaneDist").value.trim();
    const calSel = document.getElementById("newLaneCal");
    const cals = Array.from(calSel.selectedOptions).map(o => o.value);
    if (!name || !dist || cals.length === 0){
      alert("Enter lane name, distance, and select at least one caliber.");
      return;
    }
    pendingLanes.push({ name, distance: dist, calibers: cals });
    document.getElementById("newLaneName").value = "";
    document.getElementById("newLaneDist").value = "";
    Array.from(calSel.options).forEach(o => o.selected = false);
    renderLaneBuilder();
  };

  document.getElementById("submitRangeBtn").onclick = async () => {
    const errBox = document.getElementById("regError");
    errBox.innerHTML = "";
    const name = document.getElementById("rName").value.trim();
    const address = document.getElementById("rAddress").value.trim();
    const contact = document.getElementById("rContact").value.trim();
    const bHolder = document.getElementById("bHolder").value.trim();
    const bBank = document.getElementById("bBank").value.trim();
    const bAcc = document.getElementById("bAcc").value.trim();
    const bBranch = document.getElementById("bBranch").value.trim();

    if (!name || !address || !contact || pendingLanes.length === 0){
      errBox.innerHTML = `<div class="err">Fill in range name, address, contact, and add at least one lane.</div>`;
      errBox.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }
    try{
      const rangeRef = db.collection("ranges").doc();
      await rangeRef.set({
        rangeId: rangeRef.id,
        ownerUid: state.user.uid,
        name, address, contactNumber: contact,
        logoUrl: state.logoBase64 || "",
        bankingDetails: { holder: bHolder, bank: bBank, accountNumber: bAcc, branchCode: bBranch },
        status: "pending_approval",
        active: true,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
      const batch = db.batch();
      pendingLanes.forEach(l => {
        const laneRef = rangeRef.collection("lanes").doc();
        batch.set(laneRef, {
          laneId: laneRef.id, laneName: l.name, distance: l.distance,
          calibers: l.calibers, active: true
        });
      });
      await batch.commit();
      pendingLanes = [];
      await loadOwnerData();
    }catch(e){
      errBox.innerHTML = `<div class="err">${e.message}</div>`;
      errBox.scrollIntoView({ behavior: "smooth", block: "center" });
    }
  };
}

function renderLaneBuilder(){
  document.getElementById("laneBuilderList").innerHTML = pendingLanes.map((l, i) => `
    <div class="lane-item">
      <div class="info">
        <div class="name">${l.name} — ${l.distance}m</div>

function compressImageToBase64(file, maxWidth, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

  const takenSet = new Set();
  const blockedMap = {};
  state.availabilitySlotBookings.forEach(b => {
    let t = b.startTime;
    while (t !== b.endTime){
      if (b.status === "blocked") blockedMap[t] = b.id; else takenSet.add(t);
      t = addMinutes(t, 30);
    }
  });

  const slotsHtml = ALL_SLOTS.map(s => {
    let cls = "slot";

    else if (blockedMap[s]){ cls += " taken"; clickable = true; label = "Blocked"; }
    else { cls += " open"; }
    return `<div class="${cls}" data-avail-slot="${s}" data-blocked-id="${blockedMap[s] || ''}" ${clickable ? "" : "style=\"cursor:not-allowed;\""}>${label}<br><span style="font-size:9px; opacity:.7;">${s}</span></div>`;

}

  return { pending_payment:"Waiting for payment confirmation", awaiting_approval:"Awaiting approval",
    confirmed:"Confirmed", reschedule_requested:"Reschedule requested",

}

      await db.collection("bookings").doc(btn.dataset.approve).update({
        status: "confirmed", approvedAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    };
  });
  document.querySelectorAll("[data-reject]").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm("Reject this booking? The slot will free up.")) return;
      const booking = state.bookings.find(b => b.id === btn.dataset.reject);
      await db.collection("bookings").doc(btn.dataset.reject).update({ status: "cancelled" });
      await releaseSlotLocks(booking);
    };
  });

  // Range tab
  const editBtn = document.getElementById("editRangeBtn");
  if (editBtn) editBtn.onclick = () => { state.editingRange = true; render(); };
  const cancelEditBtn = document.getElementById("cancelEditRangeBtn");
  if (cancelEditBtn) cancelEditBtn.onclick = () => { state.editingRange = false; render(); };
  const saveRangeBtn = document.getElementById("saveRangeBtn");
  if (saveRangeBtn) saveRangeBtn.onclick = async () => {
    const errBox = document.getElementById("editRangeErr");
    const name = document.getElementById("erName").value.trim();
    const address = document.getElementById("erAddress").value.trim();
    const contact = document.getElementById("erContact").value.trim();
    if (!name || !address || !contact){
      errBox.innerHTML = `<div class="err">Name, address, and contact are required.</div>`;
      return;
    }
    try{
      await db.collection("ranges").doc(state.range.id).update({
        name, address, contactNumber: contact,
        bankingDetails: {
          holder: document.getElementById("erHolder").value.trim(),
          bank: document.getElementById("erBank").value.trim(),
          accountNumber: document.getElementById("erAcc").value.trim(),
          branchCode: document.getElementById("erBranch").value.trim()
        }
      });
      state.range = { ...state.range, name, address, contactNumber: contact };
      state.editingRange = false;
      await reloadRangeDoc();
    }catch(e){
      errBox.innerHTML = `<div class="err">${e.message}</div>`;
    }
  };
  document.querySelectorAll("[data-remove-closed]").forEach(btn => {
    btn.onclick = async () => {
      await db.collection("ranges").doc(state.range.id).update({
        closedDates: firebase.firestore.FieldValue.arrayRemove(btn.dataset.removeClosed)
      });
      await reloadRangeDoc();
    };
  });
  const addClosedBtn = document.getElementById("addClosedDateBtn");
  if (addClosedBtn) addClosedBtn.onclick = async () => {
    const val = document.getElementById("newClosedDate").value;
    if (!val) return;
    await db.collection("ranges").doc(state.range.id).update({
      closedDates: firebase.firestore.FieldValue.arrayUnion(val)
    });
    await reloadRangeDoc();
  };

  // Lanes tab
  document.querySelectorAll("[data-delete-lane]").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm("Delete this lane? Existing bookings for it will remain but no new ones can be made.")) return;
      await db.collection("ranges").doc(state.range.id).collection("lanes").doc(btn.dataset.deleteLane).delete();
      await reloadLanes();
    };
  });
  const dAddLaneBtn = document.getElementById("dAddLaneBtn");
  if (dAddLaneBtn) dAddLaneBtn.onclick = async () => {
    const errBox = document.getElementById("addLaneErr");
    const name = document.getElementById("dNewLaneName").value.trim();
    const dist = document.getElementById("dNewLaneDist").value.trim();
    const calSel = document.getElementById("dNewLaneCal");
    const cals = Array.from(calSel.selectedOptions).map(o => o.value);
    if (!name || !dist || cals.length === 0){
      errBox.innerHTML = `<div class="err">Enter lane name, distance, and select at least one caliber.</div>`;
      return;
    }
    const laneRef = db.collection("ranges").doc(state.range.id).collection("lanes").doc();
    await laneRef.set({ laneId: laneRef.id, laneName: name, distance: dist, calibers: cals, active: true });
    await reloadLanes();
  };

  // Availability tab
  const availLaneSelect = document.getElementById("availLaneSelect");
  if (availLaneSelect) availLaneSelect.onchange = async () => {
    state.availabilityLaneId = availLaneSelect.value;
    await loadAvailabilitySlots();
    render();
  };
  const availDateInput = document.getElementById("availDateInput");
  if (availDateInput) availDateInput.onchange = async () => {
    state.availabilityDate = availDateInput.value;
    await loadAvailabilitySlots();
    render();
  };
  document.querySelectorAll("[data-avail-slot]").forEach(el => {
    el.onclick = async () => {
      const slot = el.dataset.availSlot;
      const blockedId = el.dataset.blockedId;
      if (blockedId){
        const booking = state.availabilitySlotBookings.find(b => b.id === blockedId);
        await db.collection("bookings").doc(blockedId).delete();
        await releaseSlotLocks(booking);
      } else {
        const laneId = state.availabilityLaneId || state.lanes[0].id;
        const lane = state.lanes.find(l => l.id === laneId);
        const lockRef = db.collection("slotLocks").doc(slotLockId(state.range.id, laneId, state.availabilityDate, slot));
        const bookingRef = db.collection("bookings").doc();
        try{
          await db.runTransaction(async (tx) => {
            const snap = await tx.get(lockRef);
            if (snap.exists) throw new Error("SLOT_TAKEN");
            tx.set(lockRef, { bookingId: bookingRef.id, rangeId: state.range.id, laneId, date: state.availabilityDate, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
            tx.set(bookingRef, {
              bookingId: bookingRef.id,
              rangeId: state.range.id, rangeName: state.range.name,
              laneId, laneName: lane ? lane.laneName : "",
              date: state.availabilityDate,
              startTime: slot, endTime: addMinutes(slot, 30),
              slotTimes: [slot],
              status: "blocked",
              clientUid: state.user.uid,
              clientName: "Maintenance", clientSurname: "",
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
          });
        }catch(e){
          if (e.message === "SLOT_TAKEN") alert("This slot was just booked or blocked. Refreshing.");
          else alert(e.message);
        }
      }
      await loadAvailabilitySlots();
      render();
    };
  });

  // Bookings tab - expired deletion
  document.querySelectorAll("[data-delete-booking]").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm("Delete this expired booking?")) return;
      const booking = state.bookings.find(b => b.id === btn.dataset.deleteBooking);
      await db.collection("bookings").doc(btn.dataset.deleteBooking).delete();
      await releaseSlotLocks(booking);
    };
  });
  const clearAllExpiredBtn = document.getElementById("clearAllExpiredBtn");
  if (clearAllExpiredBtn) clearAllExpiredBtn.onclick = async () => {
    const expired = state.bookings.filter(b => b.status !== "cancelled" && b.status !== "blocked" && isBookingExpired(b));
    if (!expired.length) return;
    if (!confirm(`Delete ${expired.length} expired booking(s)? This cannot be undone.`)) return;
    const batch = db.batch();
    expired.forEach(b => {
      batch.delete(db.collection("bookings").doc(b.id));
      computeSlotTimes(b).forEach(t => batch.delete(db.collection("slotLocks").doc(slotLockId(b.rangeId, b.laneId, b.date, t))));
    });
    await batch.commit();
  };
}

function computeSlotTimes(booking){
  if (booking.slotTimes) return booking.slotTimes;
  const times = [];
  let t = booking.startTime;
  while (t !== booking.endTime){ times.push(t); t = addMinutes(t, 30); }
  return times;
}

async function releaseSlotLocks(booking){
  if (!booking) return;
  const times = computeSlotTimes(booking);
  const batch = db.batch();
  times.forEach(t => {
    batch.delete(db.collection("slotLocks").doc(slotLockId(booking.rangeId, booking.laneId, booking.date, t)));
  });
  try{ await batch.commit(); }catch(e){}
}

async function loadAvailabilitySlots(){
  const laneId = state.availabilityLaneId || (state.lanes[0] && state.lanes[0].id);
  if (!laneId) return;
  const snap = await db.collection("bookings")
    .where("rangeId", "==", state.range.id)
    .where("laneId", "==", laneId)
    .where("date", "==", state.availabilityDate)
    .get();
  state.availabilitySlotBookings = snap.docs.map(d => ({ id: d.id, ...d.data() }))
    .filter(b => b.status === "pending_payment" || b.status === "awaiting_approval" || b.status === "confirmed" || b.status === "blocked");
}

async function reloadRangeDoc(){
  const doc = await db.collection("ranges").doc(state.range.id).get();
  state.range = { id: doc.id, ...doc.data() };
  render();
}

async function reloadLanes(){
  const lanesSnap = await db.collection("ranges").doc(state.range.id).collection("lanes").get();
  state.lanes = lanesSnap.docs.map(d => ({ id: d.id, ...d.data() }));
  render();
}

  if (state.loadError) return `<div class="center">
      <div class="err" style="max-width:320px;">Couldn't load your data:<br>${state.loadError}</div>
      <button class="btn-secondary" id="retryBtn" style="max-width:200px;">Retry</button>
      <button class="link-btn" id="logoutRetryBtn">Log out</button>
    </div>`;
  if (!state.user) return authView();
  if (!state.range) return registerRangeView();
  return dashboardView();
}

function attachHandlers(){
  if (state.loading) return;
  if (state.loadError){
    document.getElementById("retryBtn").onclick = loadOwnerData;
    document.getElementById("logoutRetryBtn").onclick = () => auth.signOut();
    return;
  }
  if (!state.user) return attachAuthHandlers();
  if (!state.range) return attachRegisterHandlers();
  return attachDashboardHandlers();
}

// ---------- DATA LOADING ----------
let bookingsUnsub = null;

async function loadOwnerData(){
  state.loading = true; state.loadError = ""; render();
  try{
    const rangeSnap = await db.collection("ranges").where("ownerUid", "==", state.user.uid).limit(1).get();
    if (rangeSnap.empty){
      state.range = null; state.loading = false; render(); return;
    }
    const rangeDoc = rangeSnap.docs[0];
    state.range = { id: rangeDoc.id, ...rangeDoc.data() };

    const lanesSnap = await db.collection("ranges").doc(state.range.id).collection("lanes").get();
    state.lanes = lanesSnap.docs.map(d => ({ id: d.id, ...d.data() }));

    if (bookingsUnsub) bookingsUnsub();
    bookingsUnsub = db.collection("bookings").where("rangeId", "==", state.range.id)
      .onSnapshot(snap => {
        state.bookings = snap.docs.map(d => ({ id: d.id, ...d.data() }))
          .sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
        state.loading = false;
        render();
      }, err => {
        state.loading = false;
        state.loadError = err.message;
        render();
      });
  }catch(e){
    state.loading = false;
    state.loadError = e.message;
    render();
  }
}

auth.onAuthStateChanged(async (user) => {
  state.user = user;
  if (user){
    await loadOwnerData();
  } else {
    if (bookingsUnsub){ bookingsUnsub(); bookingsUnsub = null; }
    state.range = null; state.lanes = []; state.bookings = [];
    state.loading = false;
    render();
  }
});

setInterval(async () => {
  if (!state.user || !state.range) return;
  await reloadRangeDoc();
  await reloadLanes();
  if (state.tab === "availability") await loadAvailabilitySlots();
  render();
}, 15 * 60 * 1000);

render();
</script>
</body>
</html>
