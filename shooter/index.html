<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Shooting Range SA - Book a Range</title>
<style>
  :root{
    --bg:#0f1410; --panel:#1a211b; --panel2:#212b22; --accent:#8fae3f;
    --accent2:#c9d97a; --text:#eef1e8; --muted:#9aa596; --danger:#c25b4a;
    --ok:#5c9a5c; --warn:#c9a13c; --border:#2e3a2f;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  .app{max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative;}
  header{ background:var(--panel2); padding:16px 18px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20; }
  header .left{display:flex; align-items:center; gap:10px;}
  .hamburger{background:none; border:none; font-size:22px; color:var(--text); padding:4px 8px;}
  header h1{font-size:16px; font-weight:700;}
  header .sub{font-size:11px; color:var(--muted);}
  .logout-btn{background:none; border:1px solid var(--border); color:var(--muted); padding:6px 10px; border-radius:6px; font-size:12px;}
  main{flex:1; padding:16px; padding-bottom:30px;}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:14px;}
  .card h2{font-size:15px; margin-bottom:10px; color:var(--accent2);}
  label{display:block; font-size:12px; color:var(--muted); margin:10px 0 4px;}
  input, select, textarea{ width:100%; padding:10px; background:var(--panel2); border:1px solid var(--border); border-radius:7px; color:var(--text); font-size:14px; }
  textarea{resize:vertical; min-height:60px;}
  button{cursor:pointer; border:none; border-radius:8px; font-size:14px; font-weight:600;}
  .btn-primary{background:var(--accent); color:#12180f; padding:12px; width:100%; margin-top:14px;}
  .btn-primary:disabled{opacity:.5; cursor:not-allowed;}
  .btn-secondary{background:var(--panel2); color:var(--text); border:1px solid var(--border); padding:10px; width:100%;}
  .btn-small{padding:7px 12px; font-size:12px;}
  .btn-danger{background:var(--danger); color:#fff;}
  .back-link{background:none; border:none; color:var(--accent2); font-size:13px; margin-bottom:12px; padding:4px 0;}
  .range-item{ display:flex; gap:12px; align-items:center; background:var(--panel2); border:1px solid var(--border); border-radius:9px; padding:12px; margin-bottom:10px; cursor:pointer; }
  .range-item img{width:48px; height:48px; border-radius:8px; object-fit:cover; background:var(--panel);}
  .range-item .name{font-weight:700; font-size:14px;}
  .range-item .addr{font-size:11px; color:var(--muted); margin-top:2px;}
  .lane-item{ background:var(--panel2); border:1px solid var(--border); border-radius:9px; padding:12px; margin-bottom:10px; cursor:pointer; }
  .lane-item .name{font-weight:700; font-size:14px;}
  .lane-item .meta{font-size:11px; color:var(--muted); margin-top:4px;}
  .chip{display:inline-block; background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:2px 8px; font-size:10px; margin:3px 3px 0 0; color:var(--accent2);}
  .slot-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:10px;}
  .slot{ padding:10px 4px; text-align:center; border-radius:7px; font-size:12px; font-weight:600; border:1px solid var(--border); background:var(--panel2); color:var(--muted); }
  .slot.open{cursor:pointer; color:var(--text);}
  .slot.selected{background:var(--accent); color:#12180f; border-color:var(--accent);}
  .slot.taken{background:#331c1c; color:#8a5a5a; cursor:not-allowed;}
  .slot.past{opacity:.35; cursor:not-allowed;}
  .badge{display:inline-block; padding:3px 8px; border-radius:12px; font-size:10px; font-weight:700;}
  .badge-pending{background:#3a331a; color:var(--warn);}
  .badge-confirmed{background:#1c3320; color:var(--ok);}
  .badge-reschedule{background:#332a1a; color:#e0a85c;}
  .badge-cancelled{background:#331c1c; color:var(--danger);}
  .booking-card{background:var(--panel2); border:1px solid var(--border); border-radius:9px; padding:12px; margin-bottom:10px;}
  .booking-card .top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;}
  .booking-card .name{font-weight:700; font-size:14px;}
  .booking-card .slot-line{color:var(--accent2); font-size:12px; margin-top:2px;}
  .detail-line{font-size:12px; color:var(--muted); margin-top:4px;}
  .empty{text-align:center; color:var(--muted); font-size:13px; padding:30px 10px;}
  .err{background:#331c1c; border:1px solid var(--danger); color:#e08484; padding:9px 12px; border-radius:7px; font-size:12px; margin-top:10px;}
  .msg-ok{background:#1c3320; border:1px solid var(--ok); color:#9ed49e; padding:9px 12px; border-radius:7px; font-size:12px; margin-top:10px;}
  .center{display:flex; align-items:center; justify-content:center; min-height:60vh; flex-direction:column; gap:12px; padding:20px;}
  .drawer-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:30; display:none; }
  .drawer-overlay.open{display:block;}
  .drawer{ position:fixed; top:0; left:0; bottom:0; width:250px; background:var(--panel2); border-right:1px solid var(--border); z-index:31; transform:translateX(-100%); transition:transform .2s; padding:16px; }
  .drawer.open{transform:translateX(0);}
  .drawer h3{font-size:14px; color:var(--accent2); margin-bottom:14px;}
  .drawer button{width:100%; text-align:left; background:none; border:none; color:var(--text); padding:10px 4px; font-size:14px; border-bottom:1px solid var(--border);}
  .radio-row{display:flex; gap:10px; margin-top:6px;}
  .radio-row label{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text); margin:0;}
  .radio-row input{width:auto;}
  .link-btn{background:none; color:var(--accent2); font-size:13px; text-decoration:underline; padding:6px;}
  .proof-preview{width:100%; max-height:160px; object-fit:contain; border-radius:7px; margin-top:8px; border:1px solid var(--border); background:#000;}
</style>
</head>
<body>
<div id="root" class="app"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDtSZWvu_3X-rKwocQYSM-7f4_ICVjx7Lo",
  authDomain: "shooting-range-sa.firebaseapp.com",
  projectId: "shooting-range-sa",
  storageBucket: "shooting-range-sa.firebasestorage.app",
  messagingSenderId: "955177153514",
  appId: "1:955177153514:web:4ef02e56c771680775f893"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const OPEN_HOUR = 7;   // 07:00
const CLOSE_HOUR = 20; // last slot starts 19:30

function generateSlots(){
  const slots = [];
  for (let h = OPEN_HOUR; h < CLOSE_HOUR; h++){
    slots.push(`${String(h).padStart(2,"0")}:00`);
    slots.push(`${String(h).padStart(2,"0")}:30`);
  }
  return slots;
}
const ALL_SLOTS = generateSlots();

function addMinutes(hhmm, mins){
  const [h,m] = hhmm.split(":").map(Number);
  const total = h*60 + m + mins;
  const nh = Math.floor(total/60), nm = total%60;
  return `${String(nh).padStart(2,"0")}:${String(nm).padStart(2,"0")}`;
}

function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

let state = {
  user: null,
  profile: null,
  loading: true,
  loadError: "",
  authError: "",
  authMode: "login",
  drawerOpen: false,
  view: "rangeList", // rangeList | laneList | datePicker | slotGrid | bookingForm | myBookings
  ranges: [],
  selectedRange: null,
  lanes: [],
  selectedLane: null,
  selectedDate: todayStr(),
  bookingsForSlot: [],
  selectedSlots: [],
  myBookings: [],
  proofBase64: null,
  formError: ""
};

const root = document.getElementById("root");
function render(){ root.innerHTML = view(); attachHandlers(); }

function fmtDate(d){
  if (!d) return "";
  if (typeof d === "string") return new Date(d + "T00:00:00").toLocaleDateString('en-ZA', { day:'2-digit', month:'short', year:'numeric' });
  const dt = d.toDate ? d.toDate() : new Date(d);
  return dt.toLocaleDateString('en-ZA', { day:'2-digit', month:'short', year:'numeric' });
}

// ---------- AUTH ----------
function authView(){
  return `
    <header><div class="left"><h1>🎯 Book a Range</h1></div></header>
    <main>
      <div class="card">
        <h2 id="authTitle">${state.authMode === "login" ? "Log In" : "Create Account"}</h2>
        <div id="authErrBox">${state.authError ? `<div class="err">${state.authError}</div>` : ""}</div>
        <label>Email</label>
        <input id="authEmail" type="email" placeholder="you@example.com">
        <label>Password</label>
        <input id="authPass" type="password" placeholder="••••••••">
        <button class="btn-primary" id="authSubmit">${state.authMode === "login" ? "Log In" : "Register"}</button>
        <button class="link-btn" id="authToggle" style="margin-top:10px;">${state.authMode === "login" ? "Don't have an account? Register" : "Already have an account? Log in"}</button>
      </div>
    </main>
  `;
}

function attachAuthHandlers(){
  document.getElementById("authToggle").onclick = () => {
    state.authMode = state.authMode === "login" ? "register" : "login";
    state.authError = "";
    render();
  };
  document.getElementById("authSubmit").onclick = async () => {
    const email = document.getElementById("authEmail").value.trim();
    const pass = document.getElementById("authPass").value;
    if (!email || !pass){ state.authError = "Enter email and password."; render(); return; }
    try{
      if (state.authMode === "login"){
        await auth.signInWithEmailAndPassword(email, pass);
      } else {
        const cred = await auth.createUserWithEmailAndPassword(email, pass);
        await db.collection("users").doc(cred.user.uid).set({
          uid: cred.user.uid, email, role: "client", createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }
    }catch(e){
      state.authError = e.message;
      render();
    }
  };
}

// ---------- DRAWER / HEADER ----------
function drawerHtml(){
  return `
    <div class="drawer-overlay ${state.drawerOpen ? 'open' : ''}" id="drawerOverlay"></div>
    <div class="drawer ${state.drawerOpen ? 'open' : ''}" id="drawer">
      <h3>Menu</h3>
      <button data-nav="rangeList">🎯 Choose a Range</button>
      <button data-nav="myBookings">📋 My Bookings</button>
      <button id="drawerLogout">🚪 Log out</button>
    </div>
  `;
}

function headerHtml(title, sub){
  return `
    <header>
      <div class="left">
        <button class="hamburger" id="hamburgerBtn">☰</button>
        <div><h1>${title}</h1>${sub ? `<div class="sub">${sub}</div>` : ""}</div>
      </div>
      <button class="logout-btn" id="headerLogout">Log out</button>
    </header>
  `;
}

// ---------- RANGE LIST ----------
function rangeListView(){
  return `
    ${headerHtml("🎯 Choose a Range", state.user.email)}
    ${drawerHtml()}
    <main>
      <div class="card">
        <h2>Approved Ranges</h2>
        ${state.ranges.map(r => `
          <div class="range-item" data-select-range="${r.id}">
            ${r.logoUrl ? `<img src="${r.logoUrl}">` : `<div style="width:48px;height:48px;border-radius:8px;background:var(--panel);"></div>`}
            <div>
              <div class="name">${r.name}</div>
              <div class="addr">${r.address}</div>
            </div>
          </div>
        `).join("") || `<div class="empty">No ranges available yet</div>`}
      </div>
    </main>
  `;
}

// ---------- LANE LIST ----------
function laneListView(){
  const r = state.selectedRange;
  return `
    ${headerHtml(r.name, r.address)}
    ${drawerHtml()}
    <main>
      <button class="back-link" id="backToRanges">← All Ranges</button>
      <div class="card">
        <h2>Select a Lane</h2>
        ${state.lanes.map(l => `
          <div class="lane-item" data-select-lane="${l.id}">
            <div class="name">${l.laneName} — ${l.distance}m</div>
            <div class="meta">${(l.calibers||[]).map(c => `<span class="chip">${c}</span>`).join("")}</div>
          </div>
        `).join("") || `<div class="empty">No lanes set up yet</div>`}
      </div>
    </main>
  `;
}

// ---------- DATE PICKER ----------
function datePickerView(){
  const r = state.selectedRange, l = state.selectedLane;
  return `
    ${headerHtml(r.name, `${l.laneName} — ${l.distance}m`)}
    ${drawerHtml()}
    <main>
      <button class="back-link" id="backToLanes">← Lanes</button>
      <div class="card">
        <h2>Pick a Date</h2>
        <div id="dateErrBox"></div>
        <label>Date</label>
        <input type="date" id="dateInput" value="${state.selectedDate}" min="${todayStr()}">
        <button class="btn-primary" id="viewSlotsBtn">View Available Times</button>
      </div>
    </main>
  `;
}

// ---------- SLOT GRID ----------
function slotGridView(){
  const r = state.selectedRange, l = state.selectedLane;
  const isToday = state.selectedDate === todayStr();
  const nowHHMM = isToday ? `${String(new Date().getHours()).padStart(2,"0")}:${String(new Date().getMinutes()).padStart(2,"0")}` : null;

  const takenSet = new Set();
  const blockedSet = new Set();
  state.bookingsForSlot.forEach(b => {
    let t = b.startTime;
    while (t !== b.endTime){
      if (b.status === "blocked") blockedSet.add(t); else takenSet.add(t);
      t = addMinutes(t, 30);
    }
  });

  const slotsHtml = ALL_SLOTS.map(s => {
    let cls = "slot";
    let clickable = true;
    let label = s;
    if (takenSet.has(s)){ cls += " taken"; clickable = false; label = "Booked"; }
    else if (blockedSet.has(s)){ cls += " taken"; clickable = false; label = "Unavailable"; }
    else if (isToday && s <= nowHHMM){ cls += " past"; clickable = false; }
    else if (state.selectedSlots.includes(s)){ cls += " selected"; }
    else { cls += " open"; }
    return `<div class="${cls}" ${clickable ? `data-slot="${s}"` : ""}>${label}<br><span style="font-size:9px; opacity:.7;">${s}</span></div>`;
  }).join("");

  const canBook = state.selectedSlots.length > 0;
  const durMins = state.selectedSlots.length * 30;
  const durLabel = durMins >= 60 ? `${Math.floor(durMins/60)}h${durMins%60 ? " " + (durMins%60) + "m" : ""}` : `${durMins}m`;

  return `
    ${headerHtml(r.name, `${l.laneName} · ${fmtDate(state.selectedDate)}`)}
    ${drawerHtml()}
    <main>
      <button class="back-link" id="backToDate">← Change Date</button>
      <div class="card">
        <h2>Available Half-Hour Slots</h2>
        <div style="font-size:11px; color:var(--muted); margin-bottom:6px;">Tap consecutive open slots to book more than 30 minutes.</div>
        <div class="slot-grid">${slotsHtml}</div>
        ${state.selectedSlots.length ? `<div class="detail-line" style="margin-top:10px;"><b>Selected:</b> ${state.selectedSlots[0]}–${addMinutes(state.selectedSlots[state.selectedSlots.length-1],30)} (${durLabel})</div>` : ""}
        <button class="btn-primary" id="proceedBookBtn" ${canBook ? "" : "disabled"}>Continue to Booking</button>
      </div>
    </main>
  `;
}

// ---------- BOOKING FORM ----------
const CALIBERS_FALLBACK = [];
function bookingFormView(){
  const r = state.selectedRange, l = state.selectedLane;
  const p = state.profile || {};
  const startTime = state.selectedSlots[0];
  const endTime = addMinutes(state.selectedSlots[state.selectedSlots.length-1], 30);
  const lanCalibers = l.calibers || CALIBERS_FALLBACK;

  return `
    ${headerHtml(r.name, `${l.laneName} · ${fmtDate(state.selectedDate)} · ${startTime}–${endTime}`)}
    ${drawerHtml()}
    <main>
      <button class="back-link" id="backToSlots">← Change Time</button>
      <div class="card">
        <h2>Your Details</h2>
        <div id="formErrBox">${state.formError ? `<div class="err">${state.formError}</div>` : ""}</div>
        <label>Name</label>
        <input id="fName" value="${p.clientName || ''}">
        <label>Surname</label>
        <input id="fSurname" value="${p.clientSurname || ''}">
        <label>Cell Number</label>
        <input id="fCell" value="${p.clientCell || ''}">
        <label>Caliber</label>
        <select id="fCaliber">
          <option value="">Select caliber</option>
          ${lanCalibers.map(c => `<option value="${c}" ${p.caliber === c ? "selected" : ""}>${c}</option>`).join("")}
        </select>
        <label>Emergency Contact Name</label>
        <input id="fEcName" value="${p.emergencyContactName || ''}">
        <label>Emergency Contact Number</label>
        <input id="fEcNumber" value="${p.emergencyContactNumber || ''}">
        <label>Medical Aid?</label>
        <div class="radio-row">
          <label><input type="radio" name="medAid" value="yes" ${p.hasMedicalAid ? "checked" : ""}> Yes</label>
          <label><input type="radio" name="medAid" value="no" ${!p.hasMedicalAid ? "checked" : ""}> No</label>
        </div>
        <div id="medAidNameWrap" style="${p.hasMedicalAid ? '' : 'display:none;'}">
          <label>Medical Aid Name</label>
          <input id="fMedAidName" value="${p.medicalAidName || ''}">
        </div>
        <label>Proof of EFT Payment (screenshot)</label>
        <input id="fProof" type="file" accept="image/*">
        <img id="proofPreview" class="proof-preview" style="display:none;">
        <h3 style="font-size:12px; color:var(--muted); margin-top:14px;">Banking Details</h3>
        <div class="detail-line"><b>Holder:</b> ${r.bankingDetails?.holder || "-"}</div>
        <div class="detail-line"><b>Bank:</b> ${r.bankingDetails?.bank || "-"}</div>
        <div class="detail-line"><b>Account:</b> ${r.bankingDetails?.accountNumber || "-"}</div>
        <div class="detail-line"><b>Branch Code:</b> ${r.bankingDetails?.branchCode || "-"}</div>
        <button class="btn-primary" id="submitBookingBtn">Submit Booking</button>
      </div>
    </main>
  `;
}

// ---------- MY BOOKINGS ----------
function myBookingsView(){
  return `
    ${headerHtml("📋 My Bookings", state.user.email)}
    ${drawerHtml()}
    <main>
      <div class="card">
        <h2>Your Bookings</h2>
        ${state.myBookings.map(b => `
          <div class="booking-card">
            <div class="top">
              <div>
                <div class="name">${b.rangeName || "Range"} · ${b.laneName || "Lane"}</div>
                <div class="slot-line">${fmtDate(b.date)} · ${b.startTime}–${b.endTime}</div>
              </div>
              <span class="badge ${badgeClass(b.status)}">${statusLabel(b.status)}</span>
            </div>
            <div class="detail-line"><b>Caliber:</b> ${b.caliber}</div>
            ${b.status === "pending_payment" || b.status === "awaiting_approval" ? `
              <button class="btn-small btn-danger" style="margin-top:8px; width:100%;" data-cancel="${b.id}">Cancel Booking</button>` : ""}
            ${b.status === "confirmed" ? `
              <button class="btn-small btn-secondary" style="margin-top:8px; width:100%;" data-reschedule="${b.id}">Request Another Date</button>` : ""}
          </div>
        `).join("") || `<div class="empty">No bookings yet</div>`}
      </div>
    </main>
  `;
}

function badgeClass(status){
  return { pending_payment:"badge-pending", awaiting_approval:"badge-pending",
    confirmed:"badge-confirmed", reschedule_requested:"badge-reschedule",
    cancelled:"badge-cancelled" }[status] || "badge-pending";
}
function statusLabel(status){
  return { pending_payment:"Waiting for payment confirmation", awaiting_approval:"Awaiting approval",
    confirmed:"Confirmed", reschedule_requested:"Reschedule requested",
    cancelled:"Cancelled" }[status] || status;
}

// ---------- MASTER VIEW ----------
function view(){
  if (state.loading) return `<div class="center"><div>Loading…</div></div>`;
  if (state.loadError) return `<div class="center">
      <div class="err" style="max-width:320px;">Couldn't load data:<br>${state.loadError}</div>
      <button class="btn-secondary" id="retryBtn" style="max-width:200px;">Retry</button>
    </div>`;
  if (!state.user) return authView();
  if (state.view === "rangeList") return rangeListView();
  if (state.view === "laneList") return laneListView();
  if (state.view === "datePicker") return datePickerView();
  if (state.view === "slotGrid") return slotGridView();
  if (state.view === "bookingForm") return bookingFormView();
  if (state.view === "myBookings") return myBookingsView();
  return rangeListView();
}

function attachHandlers(){
  if (state.loading) return;
  if (state.loadError){
    document.getElementById("retryBtn").onclick = init;
    return;
  }
  if (!state.user) return attachAuthHandlers();

  // drawer common
  const hb = document.getElementById("hamburgerBtn");
  if (hb) hb.onclick = () => { state.drawerOpen = true; render(); };
  const overlay = document.getElementById("drawerOverlay");
  if (overlay) overlay.onclick = () => { state.drawerOpen = false; render(); };
  const headerLogout = document.getElementById("headerLogout");
  if (headerLogout) headerLogout.onclick = () => auth.signOut();
  const drawerLogout = document.getElementById("drawerLogout");
  if (drawerLogout) drawerLogout.onclick = () => auth.signOut();
  document.querySelectorAll("[data-nav]").forEach(btn => {
    btn.onclick = async () => {
      state.drawerOpen = false;
      if (btn.dataset.nav === "myBookings") await loadMyBookings();
      state.view = btn.dataset.nav;
      render();
    };
  });

  if (state.view === "rangeList") attachRangeListHandlers();
  if (state.view === "laneList") attachLaneListHandlers();
  if (state.view === "datePicker") attachDatePickerHandlers();
  if (state.view === "slotGrid") attachSlotGridHandlers();
  if (state.view === "bookingForm") attachBookingFormHandlers();
  if (state.view === "myBookings") attachMyBookingsHandlers();
}

function attachRangeListHandlers(){
  document.querySelectorAll("[data-select-range]").forEach(el => {
    el.onclick = async () => {
      const range = state.ranges.find(r => r.id === el.dataset.selectRange);
      state.selectedRange = range;
      await loadLanes(range.id);
      state.view = "laneList";
      render();
    };
  });
}

function attachLaneListHandlers(){
  document.getElementById("backToRanges").onclick = () => { state.view = "rangeList"; render(); };
  document.querySelectorAll("[data-select-lane]").forEach(el => {
    el.onclick = () => {
      state.selectedLane = state.lanes.find(l => l.id === el.dataset.selectLane);
      state.view = "datePicker";
      render();
    };
  });
}

function attachDatePickerHandlers(){
  document.getElementById("backToLanes").onclick = () => { state.view = "laneList"; render(); };
  document.getElementById("viewSlotsBtn").onclick = async () => {
    const chosen = document.getElementById("dateInput").value || todayStr();
    const closedDates = state.selectedRange.closedDates || [];
    if (closedDates.includes(chosen)){
      const errBox = document.getElementById("dateErrBox");
      if (errBox) errBox.innerHTML = `<div class="err">This range is closed on ${fmtDate(chosen)}. Please choose another date.</div>`;
      return;
    }
    state.selectedDate = chosen;
    state.selectedSlots = [];
    await loadSlotBookings();
    state.view = "slotGrid";
    render();
  };
}

function attachSlotGridHandlers(){
  document.getElementById("backToDate").onclick = () => { state.view = "datePicker"; render(); };
  document.querySelectorAll("[data-slot]").forEach(el => {
    el.onclick = () => {
      const s = el.dataset.slot;
      const idx = state.selectedSlots.indexOf(s);
      if (idx >= 0){
        // deselect: only allow removing from the ends to keep contiguity simple
        state.selectedSlots.splice(idx, 1);
      } else {
        state.selectedSlots.push(s);
        state.selectedSlots.sort();
      }
      // enforce contiguity: keep only the largest contiguous run containing the last click
      state.selectedSlots = enforceContiguous(state.selectedSlots, s);
      render();
    };
  });
  const proceedBtn = document.getElementById("proceedBookBtn");
  if (proceedBtn) proceedBtn.onclick = () => {
    if (state.selectedSlots.length === 0) return;
    state.view = "bookingForm";
    render();
  };
}

function enforceContiguous(slots, anchor){
  if (slots.length <= 1) return slots;
  const sorted = [...slots].sort();
  const anchorIdx = sorted.indexOf(anchor);
  let start = anchorIdx, end = anchorIdx;
  while (start > 0 && addMinutes(sorted[start-1],30) === sorted[start]) start--;
  while (end < sorted.length-1 && addMinutes(sorted[end],30) === sorted[end+1]) end++;
  return sorted.slice(start, end+1);
}

function attachBookingFormHandlers(){
  document.getElementById("backToSlots").onclick = () => { state.view = "slotGrid"; render(); };
  document.querySelectorAll('input[name="medAid"]').forEach(r => {
    r.onchange = () => {
      document.getElementById("medAidNameWrap").style.display = r.value === "yes" && r.checked ? "block" : "none";
    };
  });
  document.getElementById("fProof").onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    compressImageToBase64(file, 700, 0.6).then(b64 => {
      state.proofBase64 = b64;
      const img = document.getElementById("proofPreview");
      img.src = b64; img.style.display = "block";
    });
  };
  document.getElementById("submitBookingBtn").onclick = submitBooking;
}

function attachMyBookingsHandlers(){
  document.querySelectorAll("[data-cancel]").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm("Cancel this booking?")) return;
      await db.collection("bookings").doc(btn.dataset.cancel).update({ status: "cancelled" });
      await loadMyBookings();
      render();
    };
  });
  document.querySelectorAll("[data-reschedule]").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm("Request another date for this confirmed booking? The range owner will follow up.")) return;
      await db.collection("bookings").doc(btn.dataset.reschedule).update({ status: "reschedule_requested" });
      await loadMyBookings();
      render();
    };
  });
}

function compressImageToBase64(file, maxWidth, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function submitBooking(){
  const errBox = document.getElementById("formErrBox");
  const name = document.getElementById("fName").value.trim();
  const surname = document.getElementById("fSurname").value.trim();
  const cell = document.getElementById("fCell").value.trim();
  const caliber = document.getElementById("fCaliber").value;
  const ecName = document.getElementById("fEcName").value.trim();
  const ecNumber = document.getElementById("fEcNumber").value.trim();
  const medAidYes = document.querySelector('input[name="medAid"]:checked').value === "yes";
  const medAidName = medAidYes ? document.getElementById("fMedAidName").value.trim() : "";

  if (!name || !surname || !cell || !caliber || !ecName || !ecNumber){
    errBox.innerHTML = `<div class="err">Please fill in all required fields.</div>`;
    errBox.scrollIntoView({ behavior:"smooth", block:"center" });
    return;
  }
  if (!state.proofBase64){
    errBox.innerHTML = `<div class="err">Please upload proof of payment.</div>`;
    errBox.scrollIntoView({ behavior:"smooth", block:"center" });
    return;
  }

  const startTime = state.selectedSlots[0];
  const endTime = addMinutes(state.selectedSlots[state.selectedSlots.length-1], 30);

  try{
    const bookingRef = db.collection("bookings").doc();
    await bookingRef.set({
      bookingId: bookingRef.id,
      rangeId: state.selectedRange.id,
      rangeName: state.selectedRange.name,
      laneId: state.selectedLane.id,
      laneName: state.selectedLane.laneName,
      date: state.selectedDate,
      startTime, endTime,
      status: "pending_payment",
      clientUid: state.user.uid,
      clientName: name, clientSurname: surname, clientCell: cell,
      caliber,
      emergencyContactName: ecName, emergencyContactNumber: ecNumber,
      hasMedicalAid: medAidYes, medicalAidName: medAidName,
      paymentProofUrl: state.proofBase64,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    // save profile for next time
    await db.collection("users").doc(state.user.uid).set({
      clientName: name, clientSurname: surname, clientCell: cell, caliber,
      emergencyContactName: ecName, emergencyContactNumber: ecNumber,
      hasMedicalAid: medAidYes, medicalAidName: medAidName
    }, { merge: true });

    state.proofBase64 = null;
    state.selectedSlots = [];
    await loadMyBookings();
    state.view = "myBookings";
    render();
  }catch(e){
    errBox.innerHTML = `<div class="err">${e.message}</div>`;
    errBox.scrollIntoView({ behavior:"smooth", block:"center" });
  }
}

// ---------- DATA LOADING ----------
async function loadRanges(){
  const snap = await db.collection("ranges").where("status", "==", "approved").get();
  state.ranges = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(r => r.active !== false);
}

async function loadLanes(rangeId){
  const snap = await db.collection("ranges").doc(rangeId).collection("lanes").get();
  state.lanes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

async function loadSlotBookings(){
  const snap = await db.collection("bookings")
    .where("rangeId", "==", state.selectedRange.id)
    .where("laneId", "==", state.selectedLane.id)
    .where("date", "==", state.selectedDate)
    .get();
  state.bookingsForSlot = snap.docs.map(d => ({ id: d.id, ...d.data() }))
    .filter(b => b.status === "pending_payment" || b.status === "awaiting_approval" || b.status === "confirmed" || b.status === "blocked");
}

async function loadMyBookings(){
  const snap = await db.collection("bookings").where("clientUid", "==", state.user.uid).get();
  state.myBookings = snap.docs.map(d => ({ id: d.id, ...d.data() }))
    .sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
}

async function loadProfile(){
  const doc = await db.collection("users").doc(state.user.uid).get();
  state.profile = doc.exists ? doc.data() : {};
}

async function init(){
  state.loading = true; state.loadError = ""; render();
  try{
    await loadProfile();
    await loadRanges();
    state.loading = false;
    render();
  }catch(e){
    state.loading = false;
    state.loadError = e.message;
    render();
  }
}

auth.onAuthStateChanged(async (user) => {
  state.user = user;
  if (user){
    await init();
  } else {
    state.loading = false;
    render();
  }
});

setInterval(async () => {
  if (!state.user) return;
  if (state.view === "slotGrid"){
    await loadSlotBookings();
  } else if (state.view === "rangeList"){
    await loadRanges();
  } else if (state.view === "myBookings"){
    await loadMyBookings();
  }
  render();
}, 15 * 60 * 1000);

render();
</script>
