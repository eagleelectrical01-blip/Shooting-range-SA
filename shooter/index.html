<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Shooting Range SA - Admin</title>
<style>
  :root{
    --bg:#0f1410; --panel:#1a211b; --panel2:#212b22; --accent:#8fae3f;
    --accent2:#c9d97a; --text:#eef1e8; --muted:#9aa596; --danger:#c25b4a;
    --ok:#5c9a5c; --warn:#c9a13c; --border:#2e3a2f;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  .app{max-width:560px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}
  header{ background:var(--panel2); padding:16px 18px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:10; }
  header h1{font-size:17px; font-weight:700;}
  header .sub{font-size:11px; color:var(--muted);}
  .logout-btn{background:none; border:1px solid var(--border); color:var(--muted); padding:6px 10px; border-radius:6px; font-size:12px;}
  main{flex:1; padding:16px; padding-bottom:90px;}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:14px;}
  .card h2{font-size:15px; margin-bottom:10px; color:var(--accent2);}
  label{display:block; font-size:12px; color:var(--muted); margin:10px 0 4px;}
  input{ width:100%; padding:10px; background:var(--panel2); border:1px solid var(--border); border-radius:7px; color:var(--text); font-size:14px; }
  button{cursor:pointer; border:none; border-radius:8px; font-size:14px; font-weight:600;}
  .btn-primary{background:var(--accent); color:#12180f; padding:12px; width:100%; margin-top:14px;}
  .btn-small{padding:7px 12px; font-size:12px;}
  .btn-danger{background:var(--danger); color:#fff;}
  .btn-ok{background:var(--ok); color:#fff;}
  .btn-warn{background:var(--warn); color:#241d05;}
  .tabbar{ position:fixed; bottom:0; left:0; right:0; background:var(--panel2); border-top:1px solid var(--border); display:flex; max-width:560px; margin:0 auto; }
  .tabbar button{ flex:1; background:none; padding:12px 4px; color:var(--muted); font-size:11px; border-radius:0; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .tabbar button.active{color:var(--accent2);}
  .tabbar button .ic{font-size:18px;}
  .range-card{background:var(--panel2); border:1px solid var(--border); border-radius:9px; padding:12px; margin-bottom:10px;}
  .range-card .top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;}
  .range-card .name{font-weight:700; font-size:14px;}
  .detail-line{font-size:12px; color:var(--muted); margin-top:4px;}
  .detail-line b{color:var(--text); font-weight:600;}
  .logo-thumb{width:44px; height:44px; border-radius:8px; object-fit:cover; border:1px solid var(--border); background:var(--panel);}
  .lane-chip{display:inline-block; background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:2px 8px; font-size:10px; margin:3px 3px 0 0; color:var(--accent2);}
  .badge{display:inline-block; padding:3px 8px; border-radius:12px; font-size:10px; font-weight:700;}
  .badge-pending{background:#3a331a; color:var(--warn);}
  .badge-approved{background:#1c3320; color:var(--ok);}
  .badge-rejected{background:#331c1c; color:var(--danger);}
  .actions{display:flex; gap:8px; margin-top:10px;}
  .empty{text-align:center; color:var(--muted); font-size:13px; padding:30px 10px;}
  .err{background:#331c1c; border:1px solid var(--danger); color:#e08484; padding:9px 12px; border-radius:7px; font-size:12px; margin-top:10px;}
  .center{display:flex; align-items:center; justify-content:center; min-height:60vh; flex-direction:column; gap:12px; padding:20px;}
  .link-btn{background:none; color:var(--accent2); font-size:13px; text-decoration:underline; padding:6px;}
</style>
</head>
<body>
<div id="root" class="app"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDtSZWvu_3X-rKwocQYSM-7f4_ICVjx7Lo",
  authDomain: "shooting-range-sa.firebaseapp.com",
  projectId: "shooting-range-sa",
  storageBucket: "shooting-range-sa.firebasestorage.app",
  messagingSenderId: "955177153514",
  appId: "1:955177153514:web:4ef02e56c771680775f893"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const ADMIN_EMAILS = ["eagle.electrical01@gmail.com"];

let state = {
  user: null,
  loading: true,
  loadError: "",
  authError: "",
  tab: "pending",
  ranges: [],
  lanesByRange: {},
  editingRangeId: null
};

const root = document.getElementById("root");
function render(){ root.innerHTML = view(); attachHandlers(); }

function authView(){
  return `
    <header><div><h1>🛡️ Admin Login</h1><div class="sub">Shooting Range SA</div></div></header>
    <main>
      <div class="card">
        <h2>Sign in</h2>
        <div id="authErrBox">${state.authError ? `<div class="err">${state.authError}</div>` : ""}</div>
        <label>Email</label>
        <input id="authEmail" type="email" placeholder="admin@example.com">
        <label>Password</label>
        <input id="authPass" type="password" placeholder="••••••••">
        <button class="btn-primary" id="authSubmit">Log In</button>
      </div>
    </main>
  `;
}

function attachAuthHandlers(){
  document.getElementById("authSubmit").onclick = async () => {
    const email = document.getElementById("authEmail").value.trim();
    const pass = document.getElementById("authPass").value;
    const errBox = document.getElementById("authErrBox");
    errBox.innerHTML = "";
    if (!email || !pass){ errBox.innerHTML = `<div class="err">Enter email and password.</div>`; return; }
    try{
      await auth.signInWithEmailAndPassword(email, pass);
    }catch(e){
      errBox.innerHTML = `<div class="err">${e.message}</div>`;
    }
  };
}

function notAdminView(){
  return `
    <div class="center">
      <div class="err" style="max-width:300px;">This account (${state.user.email}) is not an admin.</div>
      <button class="link-btn" id="logoutBtn2">Log out</button>
    </div>
  `;
}

function dashboardView(){
  const pending = state.ranges.filter(r => r.status === "pending_approval");
  const approved = state.ranges.filter(r => r.status === "approved");
  const rejected = state.ranges.filter(r => r.status === "rejected");

  let list = pending;
  if (state.tab === "approved") list = approved;
  if (state.tab === "rejected") list = rejected;

  function rangeCard(r){
    const lanes = state.lanesByRange[r.id] || [];
    const badgeClass = r.status === "approved" ? "badge-approved" : r.status === "rejected" ? "badge-rejected" : "badge-pending";
    const badgeLabel = r.status === "approved" ? "Approved" : r.status === "rejected" ? "Rejected" : "Pending";
    const paused = r.active === false;
    return `
      <div class="range-card">
        <div class="top">
          <div style="display:flex; gap:10px; align-items:center;">
            ${r.logoUrl ? `<img src="${r.logoUrl}" class="logo-thumb">` : ""}
            <div>
              <div class="name">${r.name}</div>
              <div class="detail-line">${r.address}</div>
            </div>
          </div>
          <div style="display:flex; flex-direction:column; gap:4px; align-items:flex-end;">
            <span class="badge ${badgeClass}">${badgeLabel}</span>
            ${paused ? `<span class="badge badge-rejected">Paused</span>` : ""}
          </div>
        </div>
        <div class="detail-line"><b>Contact:</b> ${r.contactNumber}</div>
        <div class="detail-line"><b>Banking:</b> ${r.bankingDetails?.holder || "-"} · ${r.bankingDetails?.bank || "-"} · Acc ${r.bankingDetails?.accountNumber || "-"}</div>
        <div class="detail-line"><b>Lanes (${lanes.length}):</b></div>
        <div>
          ${lanes.map(l => `<span class="lane-chip">${l.laneName} — ${l.distance}m (${(l.calibers||[]).join(", ")})</span>`).join("")}
        </div>
        ${r.status === "pending_approval" ? `
          <div class="actions">
            <button class="btn-small btn-ok" style="flex:1;" data-approve="${r.id}">✓ Approve</button>
            <button class="btn-small btn-danger" style="flex:1;" data-reject="${r.id}">✕ Reject</button>
          </div>` : ""}
        ${r.status === "rejected" ? `
          <div class="actions">
            <button class="btn-small btn-ok" style="flex:1;" data-approve="${r.id}">✓ Approve Instead</button>
          </div>` : ""}
        <div class="actions">
          <button class="btn-small btn-secondary" style="flex:1;" data-edit="${r.id}">✎ Edit</button>
          ${r.status === "approved" ? `
            <button class="btn-small ${paused ? 'btn-ok' : 'btn-warn'}" style="flex:1;" data-toggle-pause="${r.id}">${paused ? "▶ Unpause" : "⏸ Pause"}</button>` : ""}
          <button class="btn-small btn-danger" style="flex:1;" data-delete="${r.id}">🗑 Delete</button>
        </div>
      </div>
    `;
  }

  function editRangeForm(r){
    return `
      <div class="range-card">
        <h2 style="margin-bottom:10px;">Edit ${r.name}</h2>
        <div id="editErr-${r.id}"></div>
        <label>Range Name</label>
        <input id="edName-${r.id}" value="${r.name}">
        <label>Address</label>
        <input id="edAddress-${r.id}" value="${r.address}">
        <label>Contact Number</label>
        <input id="edContact-${r.id}" value="${r.contactNumber}">
        <label>Account Holder</label>
        <input id="edHolder-${r.id}" value="${r.bankingDetails?.holder || ''}">
        <label>Bank</label>
        <input id="edBank-${r.id}" value="${r.bankingDetails?.bank || ''}">
        <label>Account Number</label>
        <input id="edAcc-${r.id}" value="${r.bankingDetails?.accountNumber || ''}">
        <label>Branch Code</label>
        <input id="edBranch-${r.id}" value="${r.bankingDetails?.branchCode || ''}">
        <div class="actions">
          <button class="btn-small btn-secondary" style="flex:1;" data-cancel-edit="${r.id}">Cancel</button>
          <button class="btn-small btn-ok" style="flex:1;" data-save-edit="${r.id}">Save</button>
        </div>
      </div>
    `;
  }

  return `
    <header>
      <div><h1>🛡️ Admin</h1><div class="sub">${state.user.email}</div></div>
      <button class="logout-btn" id="logoutBtn">Log out</button>
    </header>
    <main>
      <div class="card">
        <h2>${state.tab === "pending" ? "Pending Approval" : state.tab === "approved" ? "Approved Ranges" : "Rejected Ranges"} (${list.length})</h2>
        ${list.map(r => state.editingRangeId === r.id ? editRangeForm(r) : rangeCard(r)).join("") || `<div class="empty">Nothing here</div>`}
      </div>
    </main>
    <div class="tabbar">
      <button class="${state.tab==='pending'?'active':''}" data-tab="pending"><span class="ic">⏳</span>Pending</button>
      <button class="${state.tab==='approved'?'active':''}" data-tab="approved"><span class="ic">✅</span>Approved</button>
      <button class="${state.tab==='rejected'?'active':''}" data-tab="rejected"><span class="ic">🚫</span>Rejected</button>
    </div>
  `;
}

function attachDashboardHandlers(){
  document.getElementById("logoutBtn").onclick = () => auth.signOut();
  document.querySelectorAll("[data-tab]").forEach(btn => {
    btn.onclick = () => { state.tab = btn.dataset.tab; state.editingRangeId = null; render(); };
  });
  document.querySelectorAll("[data-approve]").forEach(btn => {
    btn.onclick = async () => {
      await db.collection("ranges").doc(btn.dataset.approve).update({ status: "approved" });
      await loadAdminData();
    };
  });
  document.querySelectorAll("[data-reject]").forEach(btn => {
    btn.onclick = async () => {
      if (!confirm("Reject this range registration?")) return;
      await db.collection("ranges").doc(btn.dataset.reject).update({ status: "rejected" });
      await loadAdminData();
    };
  });
  document.querySelectorAll("[data-toggle-pause]").forEach(btn => {
    btn.onclick = async () => {
      const r = state.ranges.find(r => r.id === btn.dataset.togglePause);
      const nowPaused = r.active === false;
      await db.collection("ranges").doc(btn.dataset.togglePause).update({ active: nowPaused ? true : false });
      await loadAdminData();
    };
  });
  document.querySelectorAll("[data-delete]").forEach(btn => {
    btn.onclick = async () => {
      const r = state.ranges.find(r => r.id === btn.dataset.delete);
      if (!confirm(`Permanently delete "${r.name}"? This cannot be undone. Existing bookings will remain but reference a deleted range.`)) return;
      const lanesSnap = await db.collection("ranges").doc(btn.dataset.delete).collection("lanes").get();
      const batch = db.batch();
      lanesSnap.docs.forEach(d => batch.delete(d.ref));
      await batch.commit();
      await db.collection("ranges").doc(btn.dataset.delete).delete();
      await loadAdminData();
    };
  });
  document.querySelectorAll("[data-edit]").forEach(btn => {
    btn.onclick = () => { state.editingRangeId = btn.dataset.edit; render(); };
  });
  document.querySelectorAll("[data-cancel-edit]").forEach(btn => {
    btn.onclick = () => { state.editingRangeId = null; render(); };
  });
  document.querySelectorAll("[data-save-edit]").forEach(btn => {
    btn.onclick = async () => {
      const id = btn.dataset.saveEdit;
      const errBox = document.getElementById(`editErr-${id}`);
      const name = document.getElementById(`edName-${id}`).value.trim();
      const address = document.getElementById(`edAddress-${id}`).value.trim();
      const contact = document.getElementById(`edContact-${id}`).value.trim();
      if (!name || !address || !contact){
        errBox.innerHTML = `<div class="err">Name, address, and contact are required.</div>`;
        return;
      }
      try{
        await db.collection("ranges").doc(id).update({
          name, address, contactNumber: contact,
          bankingDetails: {
            holder: document.getElementById(`edHolder-${id}`).value.trim(),
            bank: document.getElementById(`edBank-${id}`).value.trim(),
            accountNumber: document.getElementById(`edAcc-${id}`).value.trim(),
            branchCode: document.getElementById(`edBranch-${id}`).value.trim()
          }
        });
        state.editingRangeId = null;
        await loadAdminData();
      }catch(e){
        errBox.innerHTML = `<div class="err">${e.message}</div>`;
      }
    };
  });
}

function view(){
  if (state.loading) return `<div class="center"><div>Loading…</div></div>`;
  if (state.loadError) return `<div class="center">
      <div class="err" style="max-width:320px;">Couldn't load data:<br>${state.loadError}</div>
      <button class="link-btn" id="logoutBtn2">Log out</button>
    </div>`;
  if (!state.user) return authView();
  if (!ADMIN_EMAILS.includes(state.user.email)) return notAdminView();
  return dashboardView();
}

function attachHandlers(){
  if (state.loading) return;
  if (state.loadError){
    document.getElementById("logoutBtn2").onclick = () => auth.signOut();
    return;
  }
  if (!state.user) return attachAuthHandlers();
  if (!ADMIN_EMAILS.includes(state.user.email)){
    document.getElementById("logoutBtn2").onclick = () => auth.signOut();
    return;
  }
  return attachDashboardHandlers();
}

async function loadAdminData(){
  state.loading = true; state.loadError = ""; render();
  try{
    const rangesSnap = await db.collection("ranges").get();
    state.ranges = rangesSnap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a,b) => (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));

    const lanesByRange = {};
    for (const r of state.ranges){
      const lanesSnap = await db.collection("ranges").doc(r.id).collection("lanes").get();
      lanesByRange[r.id] = lanesSnap.docs.map(d => ({ id: d.id, ...d.data() }));
    }
    state.lanesByRange = lanesByRange;

    state.loading = false;
    render();
  }catch(e){
    state.loading = false;
    state.loadError = e.message;
    render();
  }
}

auth.onAuthStateChanged(async (user) => {
  state.user = user;
  if (user && ADMIN_EMAILS.includes(user.email)){
    await loadAdminData();
  } else {
    state.ranges = []; state.lanesByRange = {};
    state.loading = false;
    render();
  }
});

setInterval(async () => {
  if (state.user && ADMIN_EMAILS.includes(state.user.email)) await loadAdminData();
}, 15 * 60 * 1000);

render();
</script>
</body>
</html>
